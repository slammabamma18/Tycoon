<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Great Circle Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>/* Layout: full-bleed live map; HUD strip on top, dock on bottom,
   one contextual sheet (bottom on phones, right rail on wide screens). */
:root {
  --sea: #cbdbe2;
  --grat: #b9ccd5;
  --land: #e7eadf;
  --coast: #a9b4a6;
  --border: #c3c9bb;
  --ink: #16212a;
  --muted: #586672;
  --panel: #f8faf9;
  --panel-2: #eef2f1;
  --line: #d6dddc;
  --halo: #f3f5ef;
  --road: #c2700f;
  --rail: #b3263e;
  --air: #2457a8;
  --ship: #0a87a6;
  --r1: #6a8714;
  --r2: #6b4db8;
  --r3: #13875f;
  --r0: #b0367f;
  --r4: #8e3db0;
  --r5: #4f6577;
  --r6: #8f7600;
  --r7: #6d4c41;
  --r8: #37474f;
  --r9: #7c6a46;
  --good: #23794a;
  --bad: #b8322a;
  --on-mode: #ffffff;
  --shadow: 0 6px 24px rgba(22, 33, 42, .16);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --f-label: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0c1922; --grat: #142531; --land: #1a2930; --coast: #2d4049; --border: #2a3b43;
    --ink: #e6eef0; --muted: #91a3ac; --panel: #111e26; --panel-2: #182832; --line: #243540;
    --halo: #10202a; --road: #f1a33c; --rail: #f2596e; --air: #66a1ff; --ship: #4cc6e6; --r1: #b6d64e; --r2: #ab95ff; --r3: #3fd19a;
    --r0: #f07ac0; --r4: #d08cf0; --r5: #a4b8c8; --r6: #e3c548; --r7: #c9a493; --r8: #b0bec5; --r9: #d6c49a;
    --good: #5fd08d; --bad: #ff7a6b; --on-mode: #0c1922; --shadow: 0 6px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0c1922; --grat: #142531; --land: #1a2930; --coast: #2d4049; --border: #2a3b43;
  --ink: #e6eef0; --muted: #91a3ac; --panel: #111e26; --panel-2: #182832; --line: #243540;
  --halo: #10202a; --road: #f1a33c; --rail: #f2596e; --air: #66a1ff; --ship: #4cc6e6; --r1: #b6d64e; --r2: #ab95ff; --r3: #3fd19a;
    --r0: #f07ac0; --r4: #d08cf0; --r5: #a4b8c8; --r6: #e3c548; --r7: #c9a493; --r8: #b0bec5; --r9: #d6c49a;
  --good: #5fd08d; --bad: #ff7a6b; --on-mode: #0c1922; --shadow: 0 6px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sea); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--air); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.hud-cash { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.hud-co { font-family: var(--f-label); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-money { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: .01em; }
.hud-money.neg { color: var(--bad); }
.hud-date { flex-shrink: 0; text-align: right; font-family: var(--f-label); line-height: 1.1; }
.hud-date b { display: block; font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.hud-date span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.speed button { width: 32px; height: 34px; display: grid; place-items: center; color: var(--muted); }
.speed button + button { border-left: 1px solid var(--line); }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.speed svg { width: 16px; height: 16px; }

/* Dock */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
}
.dock button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 9px; color: var(--muted); font-family: var(--f-label); font-weight: 600; font-size: 13px; letter-spacing: .02em; min-width: 0; }
.dock button svg { width: 22px; height: 22px; }
.dock button[aria-pressed="true"] { color: var(--ink); }
.dock button[aria-pressed="true"] svg { stroke: var(--ink); }
.dock .badge { position: relative; }
.dock .badge::after { content: attr(data-n); position: absolute; top: -4px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--rail); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }
.dock .badge[data-n=""]::after, .dock .badge[data-n="0"]::after { display: none; }

/* Map controls */
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 4; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); background: var(--panel); border: 1px solid var(--line); }
.zoom button { width: 40px; height: 40px; display: grid; place-items: center; font-size: 22px; font-weight: 500; }
.zoom button + button { border-top: 1px solid var(--line); }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); z-index: 4; display: flex; gap: 10px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); font-family: var(--f-label); font-weight: 600; font-size: 12px; color: var(--muted); }
.legend { align-items: center; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.rival-toggle { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; margin-left: 2px; border-left: 1px solid var(--line); font-family: var(--f-label); font-weight: 600; font-size: 12px; color: var(--muted); border-radius: 0; }
.rival-toggle .dots { display: inline-flex; gap: 2px; }
.rival-toggle .dots b { width: 6px; height: 6px; border-radius: 50%; }
.rival-toggle[aria-pressed="false"] { text-decoration: line-through; opacity: .6; }

/* Sheet */
.sheet {
  position: absolute; left: 0; right: 0; z-index: 7;
  max-height: min(62%, 560px); display: flex; flex-direction: column;
  background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
}
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sheet-title { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--f-label); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet-title h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.x { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); flex-shrink: 0; }
.x:hover { background: var(--panel-2); }
.sheet-body > * { flex-shrink: 0; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding-block: 12px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

.hint { box-sizing: border-box;
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 7;
  width: min(520px, calc(100% - 24px)); display: flex; align-items: center; gap: 10px;
  padding: 10px 10px 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.hint .mode-chip { flex-shrink: 0; }
.hint p { margin: 0; flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; }
.hint p b { font-weight: 700; }

@media (min-width: 860px) {
  .sheet { left: auto; right: 12px; width: 392px; border-radius: 14px; border: 1px solid var(--line); max-height: none; }
  .dock { left: 12px; right: auto; width: 460px; bottom: 12px; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 0; }
}

/* Generic pieces */
.section { display: flex; flex-direction: column; gap: 8px; }
.section > h3 { margin: 0; font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px 12px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 22px; white-space: nowrap; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--f-label); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--muted); }
.row .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
button.row { width: 100%; text-align: left; }
button.row:hover { background: var(--panel-2); }
.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.ledger td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.ledger td:last-child { text-align: right; font-weight: 600; }
.ledger tr.total td { border-bottom: 0; font-weight: 700; padding-top: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.btn-primary { background: var(--ink); color: var(--panel); }
.btn-mode { color: var(--on-mode); }
.btn-ghost { border: 1px solid var(--line); background: var(--panel); }
.btn-ghost:hover { background: var(--panel-2); }
.btn-danger { border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.btn-row.grid2 { display: grid; grid-template-columns: 1fr 1fr; }

.mode-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px; font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--on-mode); }
.mode-chip svg { width: 15px; height: 15px; }
.bg-road { background: var(--road); } .bg-rail { background: var(--rail); } .bg-air { background: var(--air); } .bg-sea { background: var(--ship); }
.c-road { color: var(--road); } .c-rail { color: var(--rail); } .c-air { color: var(--air); } .c-sea { color: var(--ship); }
.ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; color: var(--on-mode); }
.ico svg { width: 19px; height: 19px; }

.modes { display: grid; grid-template-columns: 1fr; gap: 8px; }
.mode-card { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.mode-card:hover { background: var(--panel-2); }
.mode-card h4 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .02em; }
.mode-card p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

.flows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flow { padding: 10px; border-radius: 10px; background: var(--panel-2); min-width: 0; }
.flow .dir { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow div.l { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.flow div.l span:last-child { font-weight: 600; }

.models { display: flex; flex-direction: column; gap: 6px; }
.model { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.model[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.model[disabled] { opacity: .5; cursor: not-allowed; }
.model .radio { box-sizing: border-box; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); grid-row: span 2; }
.model[aria-pressed="true"] .radio { border: 6px solid var(--ink); }
.model .t { font-weight: 700; }
.model .p { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.model .s { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 44px; height: 42px; font-size: 22px; display: grid; place-items: center; }
.stepper button:hover { background: var(--panel-2); }
.stepper output { min-width: 44px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.count-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.estimate { padding: 12px; border-radius: 12px; border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.cta-bar { position: sticky; bottom: -18px; margin-bottom: -18px; padding-block: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; z-index: 1; }
.estimate .big { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.warn { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 12%, var(--panel)); color: var(--ink); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; background: var(--panel-2); font-size: 13px; font-weight: 600; }
.chip .pips { letter-spacing: 1px; color: var(--muted); font-size: 10px; }
.bars { width: 100%; height: 96px; display: block; }
.goal { display: flex; gap: 10px; align-items: flex-start; }
.goal .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; margin-top: 1px; }
.goal.done .ck { background: var(--good); border-color: var(--good); color: var(--panel); }
.goal.done .t { text-decoration: line-through; text-decoration-color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--ink); }
.news { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.news div { display: flex; gap: 10px; }
.news time { color: var(--muted); font-family: var(--f-label); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
input[type="text"], select { width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }

/* Toasts */
.toasts { position: absolute; left: 50%; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; gap: 6px; width: min(460px, calc(100% - 24px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--panel); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); animation: tin .25s ease-out; }
.toast.goal { background: var(--good); color: var(--on-mode); }
.toast.danger { background: var(--bad); color: var(--on-mode); }

/* Market, shares, fares */
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.sharebar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.sharebar i { display: block; height: 100%; min-width: 2px; }
.sharebar i + i { border-left: 2px solid var(--panel); }
.sharelegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.sharelegend span { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 40px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg-est button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 52px; padding: 4px 2px; }
.seg-est small { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.seg-est button[aria-pressed="true"] small { color: var(--panel); }
.seg-est small.bad { color: var(--bad); }
.seg.tabs { grid-template-columns: 1fr 1fr; }
.seg.tabs button { min-height: 38px; }
.wars { display: flex; flex-direction: column; gap: 12px; }
.war { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.war header { display: flex; align-items: flex-start; gap: 10px; }
.war header .grow { flex: 1; min-width: 0; }
.war header .s { font-size: 12.5px; color: var(--muted); }
.war .cost { text-align: right; white-space: nowrap; }
.war .cost b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.war .cost span { font-size: 12px; color: var(--muted); }
.linkish { font-weight: 700; font-size: 16px; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.trend { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.spark.wide { width: 96px; height: 26px; flex-shrink: 0; }
.war-link { border: 1px solid var(--line); border-radius: 10px; }
.war-link .v { font-size: 20px; color: var(--muted); }
.econ { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.econ b { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; }
.econ span { color: var(--muted); font-size: 14px; }
.goods { display: grid; grid-template-columns: 1fr; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }

function sharePrice(S, id) {
  const T = S.cos[id];
  const depletion = clampN(1 - T.own.float / T.floatInit, 0, 1);
  return T.cap / 100 * (1.03 + 0.6 * depletion);
}
function shareSellPrice(S, id) { return S.cos[id].cap / 100 * 0.95; }

function buyShares(S, C, buyerId, targetId, pct, hooks) {
  const B = S.cos[buyerId], T = S.cos[targetId];
  if (!B || !T) return { ok: false, msg: 'That company is gone.' };
  if (buyerId === targetId && S.t < sharesOpenDay(S)) return { ok: false, msg: 'Buybacks open with the share market.' };
  pct = Math.floor(Math.min(pct, T.own.float) * 1000 + 1e-6) / 1000;
  if (pct <= 0) return { ok: false, msg: 'No shares are left on the market.' };
  const cost = pct * 100 * sharePrice(S, targetId);
  if (B.cash < cost - 0.5) return { ok: false, msg: `You need ${fmtMoney(cost)}.` };
  B.cash -= cost; B.ledger.cur.capex += cost;
  T.own.float = Math.max(0, T.own.float - pct);
  T.own[buyerId] = (T.own[buyerId] || 0) + pct;
  if (buyerId === targetId) {
    if (B.human) logTo(S, buyerId, `You bought back ${fmtPct(pct)} of your own shares.`, 'deal', `${B.short} bought back ${fmtPct(pct)} of its own shares.`);
    else log(S, `${B.short} bought back ${fmtPct(pct)} of its own shares.`, 'deal', buyerId);
  } else {
    const plain = `${B.short} bought ${fmtPct(pct)} of ${T.short} and now owns ${fmtPct(T.own[buyerId])}.`;
    if (B.human) logTo(S, buyerId, `You bought ${fmtPct(pct)} of ${T.short}. You now own ${fmtPct(T.own[buyerId])}.`, 'deal', plain);
    else if (T.human) logTo(S, targetId, `${B.short} bought ${fmtPct(pct)} of your company and now owns ${fmtPct(T.own[buyerId])}.`, 'deal', plain);
    else log(S, plain, 'deal', buyerId);
  }
  checkTakeover(S, C, targetId, hooks);
  return { ok: true, cost, pct };
}
function sellShares(S, C, sellerId, targetId, pct) {
  const B = S.cos[sellerId], T = S.cos[targetId];
  const held = T.own[sellerId] || 0;
  pct = Math.floor(Math.min(pct, held) * 1000 + 1e-6) / 1000;
  if (pct <= 0) return { ok: false };
  const value = pct * 100 * shareSellPrice(S, targetId);
  B.cash += value; B.ledger.cur.capex -= value;
  T.own[sellerId] = held - pct; T.own.float += pct;
  if (T.own[sellerId] < 1e-6) delete T.own[sellerId];
  if (T.parent && T.parent === sellerId && (T.own[sellerId] || 0) < 0.51 - 1e-9) {
    delete T.parent;
    logTo(S, sellerId, `${T.short} is independent again. You hold ${fmtPct(T.own[sellerId] || 0)}.`, 'deal', `${T.short} is independent again.`);
  }
  return { ok: true, value, pct };
}

function checkTakeover(S, C, targetId, hooks) {
  const T = S.cos[targetId];
  if (!T || T.lost || S.over) return;
  for (const h in T.own) {
    if (h === 'float' || h === targetId || !S.cos[h]) continue;
    if (T.own[h] >= 0.51 - 1e-9) {
      // a human controlling a computer rival keeps it as a subsidiary; anything else merges
      if (S.cos[h].human && !T.human) { if (T.parent !== h) makeSubsidiary(S, C, targetId, hooks, h); return; }
      takeover(S, C, h, targetId, hooks); return;
    }
  }
}
function makeSubsidiary(S, C, id, hooks, by) {
  const T = S.cos[id], H = S.cos[by];
  T.parent = by; T.payout = 0.5; T.payoutBy = by; T.siege = null;
  if (!H.pd.stats.ctl.includes(id)) H.pd.stats.ctl.push(id);
  S.offers = S.offers.filter(o => o.co !== id);
  const text = `You now control ${T.name}. It runs as your subsidiary in ${REGION_NAMES[T.region] || 'its region'} and pays you dividends. You can merge it into your company any time.`;
  const alt = `${H.short} took control of ${T.name}.`;
  logTo(S, by, text, 'deal', alt);
  if (hooks && hooks.takeover) hooks.takeover(by, id, text, alt);
}
function mergeCost(S, id) {
  const T = S.cos[id];
  let c = 0;
  for (const h in T.own) if (h !== 'float' && h !== id && h !== T.parent && S.cos[h]) c += T.own[h] * T.cap;
  return c;
}
function mergeSubsidiary(S, C, id, hooks, me) {
  me = me || 'p';
  const T = S.cos[id];
  if (!T || T.parent !== me) return { ok: false, msg: 'You do not control that company.' };
  const cost = mergeCost(S, id);
  if (S.cos[me].cash + T.cash < cost) return { ok: false, msg: `Merging pays other shareholders ${fmtMoney(cost)}.` };
  takeover(S, C, me, id, hooks);
  return { ok: true };
}

function takeover(S, C, acqId, tgtId, hooks, sale) {
  const A = S.cos[acqId], T = S.cos[tgtId];
  const cap = T.cap;
  // minority shareholders are paid out at market value
  for (const h in T.own) {
    if (h === 'float' || h === tgtId || h === acqId || !S.cos[h]) continue;
    const pay = T.own[h] * cap;
    S.cos[h].cash += pay; A.cash -= pay;
  }
  // routes, terminals, track, money
  for (const r of S.routes.slice()) if (r.co === tgtId) transferRoute(S, C, r, acqId);
  for (const c in T.fac) { A.fac[c] = A.fac[c] || {}; Object.assign(A.fac[c], T.fac[c]); }
  for (const k in T.track) if (!A.track[k]) A.track[k] = T.track[k];
  for (const c in T.svc) if (!A.svc[c] || A.svc[c].r < T.svc[c].r) A.svc[c] = T.svc[c];
  A.hubs = A.hubs || {};
  for (const c in T.hubs || {}) if (A.hubs[c] == null) A.hubs[c] = T.hubs[c];
  A.cash += T.cash; A.loan += T.loan;
  // stakes the target held in others now belong to the acquirer
  for (const id in S.cos) {
    const X = S.cos[id];
    if (id === tgtId || !X.own[tgtId]) continue;
    X.own[acqId] = (X.own[acqId] || 0) + X.own[tgtId];
    delete X.own[tgtId];
  }
  S.offers = S.offers.filter(o => o.co !== tgtId);
  for (const pid in S.projects) if (S.projects[pid].owner === tgtId) S.projects[pid].owner = acqId;
  for (const id in S.cos) if (S.cos[id].parent === tgtId) { if (A.human) S.cos[id].parent = acqId; else delete S.cos[id].parent; }
  if (T.human) { retire(T); T.bid = null; T.out = sale != null ? { type: 'sold', by: A.name, price: sale, t: S.t } : { type: 'takeover', by: A.name, t: S.t }; } else delete S.cos[tgtId];
  for (const id in S.cos) if (S.cos[id].bid && S.cos[id].bid.by === tgtId) S.cos[id].bid = null;
  S.gone.push({ id: tgtId, name: T.name, by: A.name, t: S.t, slot: T.slot });
  computeRates(S, C);
  updateCaps(S);
  const alt = `${A.short} took over ${T.short}.`;
  let text = alt;
  if (T.human && sale != null) { text = `You sold ${T.name} to ${A.name} for ${fmtMoney(sale)}.`; logTo(S, tgtId, text, 'deal', `${A.short} bought ${T.short}.`); }
  else if (T.human) { text = `${A.name} bought 51% of ${T.name} and took over your company.`; logTo(S, tgtId, text, 'deal', alt); }
  else if (A.human) { text = `You took control of ${T.name}. Its routes, fleet and cash are now yours.`; logTo(S, acqId, text, 'deal', alt); }
  else log(S, text, 'deal', acqId);
  if (A.human) { A.pd.acquired = (A.pd.acquired || 0) + 1; if (!A.pd.stats.ctl.includes(tgtId)) A.pd.stats.ctl.push(tgtId); }
  if (T.human) markOver(S);
  if (hooks && hooks.takeover) hooks.takeover(acqId, tgtId, text, alt, T.human ? tgtId : acqId);
  for (const id in S.cos) checkTakeover(S, C, id, hooks);
}

// A player's company leaves the game but stays on record, so its player can see what happened.
function retire(K) {
  K.lost = true; K.cash = 0; K.loan = 0; K.fac = {}; K.track = {}; K.svc = {}; K.hubs = {}; K.debtMonths = 0;
  K.own = { [K.id]: 0, float: 1 };
  K.pd.auto.on = false;
}
// The world stops only when no human company is left.
function markOver(S) {
  if (humans(S).length) return;
  S.over = true;
  const last = Object.values(S.cos).filter(k => k.human && k.out).sort((a, b) => (b.out.t || 0) - (a.out.t || 0))[0];
  S.overReason = last ? last.out : { type: 'bankrupt' };
}
// A human company that ran out of money: its routes close and its shares become worthless.
function humanBankrupt(S, C, K, hooks) {
  for (const r of S.routes.slice()) if (r.co === K.id) closeRoute(S, C, r, true);
  for (const x in S.cos) if (S.cos[x].own[K.id] && x !== K.id) { S.cos[x].own.float += S.cos[x].own[K.id]; delete S.cos[x].own[K.id]; }
  for (const id in S.cos) if (S.cos[id].parent === K.id) delete S.cos[id].parent;
  retire(K); K.out = { type: 'bankrupt', t: S.t };
  logTo(S, K.id, `${K.name} went bankrupt.`, 'deal', `${K.name} went bankrupt.`);
  if (hooks && hooks.news) hooks.news(`${K.name} went bankrupt.`, 'war', null);
  markOver(S);
}
function collapse(S, C, id, hooks) {
  const K = S.cos[id];
  for (const r of S.routes.slice()) if (r.co === id) closeRoute(S, C, r, true);
  for (const x in S.cos) if (S.cos[x].own[id]) { S.cos[x].own.float += S.cos[x].own[id]; delete S.cos[x].own[id]; }
  S.offers = S.offers.filter(o => o.co !== id);
  for (const pid in S.projects) {
    const pr = S.projects[pid];
    if (pr.owner !== id) continue;
    if (pr.status === 'building') delete S.projects[pid]; else pr.owner = null;
  }
  delete S.cos[id];
  S.gone.push({ id, name: K.name, by: null, t: S.t, slot: K.slot });
  computeRates(S, C);
  const text = `${K.name} went bankrupt. Its routes are gone and its shares are worthless.`;
  log(S, text, 'deal', id);
  if (hooks && hooks.news) hooks.news(text);
}

function windUp(S, C, K, hooks) {
  const pot = Math.max(0, K.cash - K.loan);
  for (const h in K.own) {
    if (h === 'float' || h === K.id || !S.cos[h]) continue;
    const amt = pot * K.own[h];
    S.cos[h].cash += amt; S.cos[h].ledger.cur.div += amt;
    if (S.cos[h].human) S.cos[h].pd.stats.div += amt;
  }
  for (const x in S.cos) if (S.cos[x].own[K.id]) { S.cos[x].own.float += S.cos[x].own[K.id]; delete S.cos[x].own[K.id]; }
  for (const pid in S.projects) if (S.projects[pid].owner === K.id) { if (S.projects[pid].status === 'building') delete S.projects[pid]; else S.projects[pid].owner = null; }
  S.offers = S.offers.filter(o => o.co !== K.id);
  delete S.cos[K.id];
  S.gone.push({ id: K.id, name: K.name, by: null, t: S.t, slot: K.slot });
  const text = `${K.name} ran out of routes and wound up its business, paying its cash out to shareholders.`;
  log(S, text, 'deal', K.id);
  if (hooks && hooks.news) hooks.news(text);
}

// A struggling rival sells a route for cash.
function offerRoute(S, C, r, discount) {
  if (S.offers.some(o => o.routeId === r.id)) return;
  let price = 0;
  for (const v of r.v) price += resaleValue(S, v);
  price *= discount;
  if (r.mode === 'rail') price += r.dist * MODES.rail.trackKm * 0.35;
  price = Math.max(1e5, Math.round(price / 1e4) * 1e4);
  S.offers.push({ id: S.nextId++, co: r.co, routeId: r.id, price, until: S.t + 90 });
  const K = S.cos[r.co];
  log(S, `${K.short} is selling its ${C[r.a].name} – ${C[r.b].name} ${MODES[r.mode].name.toLowerCase()} route for ${fmtMoney(price)}.`, 'deal', r.co);
}
function acceptOffer(S, C, offerId, me) {
  me = me || 'p';
  const o = S.offers.find(x => x.id === offerId);
  if (!o) return { ok: false, msg: 'That offer has expired.' };
  const P = S.cos[me], K = S.cos[o.co];
  const r = S.routes.find(x => x.id === o.routeId);
  if (!r || !K) { S.offers = S.offers.filter(x => x !== o); return { ok: false, msg: 'That offer has expired.' }; }
  if (P.cash < o.price - 0.5) return { ok: false, msg: `You need ${fmtMoney(o.price)}.` };
  P.cash -= o.price; P.ledger.cur.capex += o.price; K.cash += o.price;
  if (findRoute(S, me, r.mode, r.a, r.b)) P.pd.stats.warWins++;
  transferRoute(S, C, r, me);
  computeRates(S, C);
  logTo(S, me, `You bought ${C[r.a].name} – ${C[r.b].name} from ${K.short} for ${fmtMoney(o.price)}.`, 'deal', `${P.short} bought ${C[r.a].name} – ${C[r.b].name} from ${K.short}.`);
  return { ok: true, route: r };
}

function servedCities(S, coId) {
  const s = new Set();
  for (const r of S.routes) if (r.v.length && (!coId || r.co === coId)) { s.add(r.a); s.add(r.b); }
  return s;
}

// ---------- simulation ----------
function poolFor(S, r, from, to) {
  const k = pairKey(from, to) + r.mode + '|' + r.co;
  if (!S.pools[k]) S.pools[k] = { ab: {}, ba: {} };
  return S.pools[k][dirKey(from, to)];
}

function depart(S, C, r, v) {
  const K = S.cos[r.co];
  const m = MODEL[v.m];
  const from = v.d === 0 ? r.a : r.b, to = v.d === 0 ? r.b : r.a;
  const pool = poolFor(S, r, from, to);
  const c = {};
  let room = m.cap, loaded = 0;
  if (m.kind === 'pax') {
    const q = Math.min(room, pool.pax || 0); pool.pax = (pool.pax || 0) - q; c.pax = q; loaded = q;
  } else {
    for (const g of carries(m)) {
      if (room <= 0) break;
      const q = Math.min(room, pool[g] || 0);
      if (q > 0) { pool[g] -= q; c[g] = q; room -= q; loaded += q; }
    }
  }
  v.c = c;
  const run = r.dist * m.run * fuelCost(S, m);
  K.cash -= run; K.ledger.cur.run += run; r.mon.cost += run; r.life.cost += run;
  const toll = r.canals && r.canals.length ? canalToll(r, m) : 0;
  if (toll) { K.cash -= toll; K.ledger.cur.tollOut += toll; r.mon.cost += toll; r.life.cost += toll; }
  r.load = r.load * 0.9 + (loaded / m.cap) * 0.1;
  const sv = K.svc[from] || (K.svc[from] = { r: 0.65, d: 0, n: 0 });
  sv.n++;
  v.p = 1; v.t0 = v.t1; v.t1 = v.t0 + legDays(m, r.dist) - MODES[r.mode].load;
}

function arrive(S, C, r, v, hooks) {
  const K = S.cos[r.co];
  const m = MODEL[v.m];
  const to = v.d === 0 ? r.b : r.a;
  const F = FARES[r.fare == null ? 1 : r.fare];
  let rev = 0;
  for (const g in v.c || {}) {
    const q = v.c[g];
    rev += q * unitPrice(g, r.mode) * goodPrice(S, g) * chargeKm(r.mode, r.fd || r.dist) * (g === 'pax' ? m.fare : 1) * F.price;
    if (K.human) { if (g === 'pax') K.pd.totals.pax += q; else K.pd.totals.tons += q; }
  }
  rev *= S.econ.pf || 1;
  K.cash += rev; K.ledger.cur.rev[r.mode] += rev; r.mon.rev += rev; r.life.rev += rev; r.trips++;
  if (r.via && r.via.length && rev > 0) {
    for (const pid of r.via) {
      const pr = S.projects[pid];
      if (!pr || !pr.owner || pr.owner === r.co || !S.cos[pr.owner]) continue;
      const toll = rev * TOLL_RATE, O = S.cos[pr.owner];
      K.cash -= toll; K.ledger.cur.tollOut += toll; r.mon.cost += toll; r.life.cost += toll;
      O.cash += toll; O.ledger.cur.toll += toll; pr.earned = (pr.earned || 0) + toll;
      if (O.human) O.pd.stats.toll += toll;
    }
  }
  if (hooks && hooks.deliver && rev > 0 && K.human) hooks.deliver(r, v, to, rev);
  v.c = null; v.d = 1 - v.d; v.p = 0; v.t0 = v.t1; v.t1 = v.t0 + MODES[r.mode].load;
}

function updateService(S) {
  const byCity = {};
  for (const r of S.routes) {
    for (const [c, from, to] of [[r.a, r.a, r.b], [r.b, r.b, r.a]]) {
      const key = r.co + ':' + c;
      const e = byCity[key] || (byCity[key] = { wait: 0, cap: 0, age: 0, n: 0 });
      const pk = pairKey(from, to) + r.mode + '|' + r.co;
      const pool = S.pools[pk] && S.pools[pk][dirKey(from, to)];
      const rt = S._rates && S._rates[pk] && S._rates[pk][dirKey(from, to)];
      const hold = (S._poolDays && S._poolDays[pk]) || POOL_DAYS;
      if (pool && rt) for (const g in rt) { e.wait += pool[g] || 0; e.cap += rt[g] * hold; }
      for (const v of r.v) { e.age += (S.t - v.b) / 365; e.n++; }
    }
  }
  for (const id in S.cos) {
    const K = S.cos[id];
    for (const c in K.svc) {
      const s = K.svc[c];
      s.d = s.d * 0.95 + s.n * 0.05; s.n = 0;
      const e = byCity[id + ':' + c];
      if (!e) { s.r += (0.5 - s.r) * 0.01; if (s.d < 0.01) delete K.svc[c]; continue; }
      const fill = e.cap > 0 ? e.wait / e.cap : 0;
      const age = e.n ? e.age / e.n : 0;
      const target = 0.25 + 0.4 * Math.min(1, s.d / 1.2) + 0.25 * (1 - fill) + 0.1 * (1 - Math.min(1, age / 12));
      s.r += (target - s.r) * 0.04;
    }
  }
}

function daily(S, C, hooks) {
  const rates = S._rates || computeRates(S, C);
  for (const k in rates) {
    const p = S.pools[k] || (S.pools[k] = { ab: {}, ba: {} });
    for (const dk of ['ab', 'ba']) {
      const rr = rates[k][dk], pp = p[dk];
      const hold = (S._poolDays && S._poolDays[k]) || POOL_DAYS;
      for (const g in rr) pp[g] = Math.min(rr[g] * hold, (pp[g] || 0) + rr[g]);
    }
  }
  for (const r of S.routes) {
    const K = S.cos[r.co];
    let rm = 0;
    for (const v of r.v) rm += MODEL[v.m].maint / 365;
    r.mon.cost += rm; r.life.cost += rm;
    K.cash -= rm; K.ledger.cur.maint += rm;
  }
  const rate = S.econ.rate || LOAN_RATE;
  for (const id in S.cos) {
    const K = S.cos[id];
    let infra = 0;
    for (const c in K.fac) for (const m in K.fac[c]) infra += MODES[m].term.maint / 365;
    for (const k in K.track) infra += K.track[k] * MODES.rail.trackMaint / 365;
    for (const c in K.hubs || {}) infra += HUB.maint / 365;
    const interest = K.loan * rate / 365;
    const office = officeYr(S, routeCount(S, id)) / 365;
    K.cash -= infra + interest + office;
    K.ledger.cur.infra += infra; K.ledger.cur.interest += interest; K.ledger.cur.office = (K.ledger.cur.office || 0) + office;
  }
  updateService(S);
  // each rival reviews its business once a month, on its own day
  const dom = Math.floor(S.t) % 30;
  for (const K of rivals(S)) {
    if (S.over || !S.cos[K.id]) continue;
    if (K.thinkDay == null) K.thinkDay = ((K.slot || 1) * 9 + 4) % 30;
    if (dom === K.thinkDay) rivalMonth(S, C, K, hooks);
  }
  if (!S._rates) computeRates(S, C);
  for (const H of humans(S)) if (H.pd.auto.on && !S.over) autoDay(S, C, H, hooks);

  const before = S.events.length;
  const canalBefore = S.events.some(e => e.type === 'canal');
  S.events = S.events.filter(e => e.until > S.t);
  if (canalBefore && !S.events.some(e => e.type === 'canal')) {
    rerouteSea(S, C);
    const text = 'The canal is open again. Ships are back on their usual routes.';
    log(S, text, 'event');
    if (hooks && hooks.news) hooks.news(text);
  }
  if (S.events.length !== before) computeRates(S, C);
  if (S.t >= S.nextEvent) { rollEvent(S, C, hooks); S.nextEvent = S.t + 35 + rand(S) * 45; }

  const d = dateOf(S.t), mk = d.getUTCFullYear() * 12 + d.getUTCMonth();
  if (!S.lastMonth) S.lastMonth = mk;
  if (mk !== S.lastMonth) { closeMonth(S, C, hooks); S.lastMonth = mk; }
}

function monthProfit(m) {
  return m.rev.road + m.rev.rail + m.rev.air + (m.rev.sea || 0) - m.run - m.maint - m.infra - m.interest - (m.office || 0) + (m.div || 0) + (m.toll || 0) - (m.tollOut || 0);
}

const PHASE_NEWS = {
  growth: () => 'The recovery is complete. The world economy is growing again.',
  hot: E => `Economists warn the boom is overheating. Interest rates are heading to ${(PHASES.hot.rate * 100).toFixed(1)}%. Booms like this usually end in a recession within a year.`,
  bust: () => 'Recession. Travel and trade are falling fast, banks are lending less, and share prices have slumped.',
  recovery: () => `The recession is easing. Interest rates are being cut to ${(PHASES.recovery.rate * 100).toFixed(0)}% to get the economy moving.`,
};
function phaseLen(S, ph) {
  const P = PHASES[ph], L = diffOf(S).id === 'hard' ? P.hard : P.len;
  return Math.round(L[0] + rand(S) * (L[1] - L[0]));
}
// Normal and Hard: a business cycle with a warning before each recession.
function updateCycle(S, hooks) {
  const E = S.econ, D = diffOf(S);
  if (!E.phase) {
    // the first recession comes three to five years in
    E.phase = 'growth'; E.pm = 0; E.plen = phaseLen(S, 'growth') + 6;
  }
  E.pm++;
  if (E.pm >= E.plen) {
    E.phase = NEXT_PHASE[E.phase]; E.pm = 0; E.plen = phaseLen(S, E.phase);
    const text = PHASE_NEWS[E.phase](E);
    log(S, text, 'event');
    if (hooks && hooks.news) hooks.news(text, E.phase === 'bust' || E.phase === 'hot' ? 'war' : '');
  }
  const P = PHASES[E.phase];
  const target = P.g == null ? 1 - D.depth : P.g;
  E.noise = E.noise * 0.7 + gauss(S) * 0.01;
  E.base = (E.base == null ? E.g : E.base) + (target - (E.base == null ? E.g : E.base)) * P.gs;
  E.g = clampN(E.base + E.noise, 0.6, 1.2);
  E.rate += (P.rate - E.rate) * 0.3;
  E.mood += (P.mood - E.mood) * 0.3;
  // in a recession customers also haggle: fares and freight rates slip
  E.pf = (E.pf || 1) + (P.pf - (E.pf || 1)) * 0.3;
  E.state = E.phase === 'bust' ? 'recession' : E.phase === 'hot' || E.g >= 1.06 ? 'boom' : 'steady';
}
function updateEconomy(S, hooks) {
  const E = S.econ;
  if (diffOf(S).deep) { updateCycle(S, hooks); updatePrices(S); return; }
  E.ang += 2 * Math.PI / (12 * 7);
  E.noise = E.noise * 0.75 + gauss(S) * 0.022;
  E.g = clampN(1 + 0.09 * Math.sin(E.ang) + E.noise, 0.82, 1.18);
  const state = E.g >= 1.06 ? 'boom' : E.g <= 0.94 ? 'recession' : 'steady';
  if (state !== E.state) {
    const pct = Math.round(Math.abs(E.g - 1) * 100);
    const text = state === 'boom' ? `The world economy is booming. Travel and trade are up ${pct}%.`
      : state === 'recession' ? `Recession. Travel and trade are down ${pct}%.` : 'The world economy has steadied.';
    E.state = state;
    log(S, text, 'event');
    if (hooks && hooks.news) hooks.news(text);
  }
  updatePrices(S);
}
function updatePrices(S) {
  const E = S.econ;
  for (const g of GOOD_IDS) {
    E.prices[g] = clampN(E.prices[g] + 0.12 * (1 - E.prices[g]) + gauss(S) * 0.05, 0.55, 1.9);
    E.ph[g].push(E.prices[g]);
    if (E.ph[g].length > 24) E.ph[g].shift();
  }
}

function updateCities(S, C) {
  const dep = {};
  for (const id in S.cos) for (const c in S.cos[id].svc) dep[c] = (dep[c] || 0) + S.cos[id].svc[c].d;
  for (const c of C) {
    const s = S.cities[c.i];
    const base = (GROWTH[c.cc] != null ? GROWTH[c.cc] : 0.3) / 100;
    const service = 0.012 * Math.min(1, (dep[c.i] || 0) / 4);
    const rate = base + service + gauss(S) * 0.003 + (S.econ.g - 1) * 0.02;
    s.pop = Math.max(0.2, s.pop * (1 + rate / 12));
    s.g = rate;
    const inc = INCOME[c.cc] != null ? INCOME[c.cc] : 0.008;
    s.w = Math.min(3.6, s.w + inc / 12 * (s.w < 3 ? 1 : 0.3) * (S.econ.state === 'recession' ? 0.3 : 1));
  }
  applyCities(S, C);
}

function closeMonth(S, C, hooks) {
  const prev = dateOf(S.t - 1);
  for (const id in S.cos) {
    const K = S.cos[id];
    const cur = K.ledger.cur;
    K.ledger.hist.push({ y: prev.getUTCFullYear(), m: prev.getUTCMonth(), ...cur, profit: monthProfit(cur) });
    if (K.ledger.hist.length > 36) K.ledger.hist.shift();
    K.ledger.cur = blankMonth();
  }
  for (const r of S.routes) {
    r.hist.push(r.mon.rev - r.mon.cost);
    if (r.hist.length > 12) r.hist.shift();
    r.mon = { rev: 0, cost: 0 };
    r.sh = r.sh || [];
    r.sh.push(myShare(S, r));
    if (r.sh.length > 12) r.sh.shift();
  }
  updateEconomy(S, hooks);
  updateCities(S, C);
  if (prev.getUTCMonth() % 3 === 2) payDividends(S, C, hooks);
  buildProjects(S, C, hooks);
  // the bank covers cash gaps while it can
  for (const id of Object.keys(S.cos)) {
    const K = S.cos[id];
    if (!K) continue;
    if (K.cash < 0) {
      const got = borrow(S, id, Math.ceil(-K.cash / 1e5) * 1e5);
      if (got && K.human) logTo(S, id, `The bank covered a cash shortfall with a ${fmtMoney(got)} loan.`, 'warn', `${K.short} borrowed to cover a cash shortfall.`);
    }
    if (K.lost) continue;
    if (K.cash < 0) {
      K.debtMonths++;
      if (K.human) {
        logTo(S, id, `Cash is negative and the bank won't lend more. ${4 - K.debtMonths} month(s) until bankruptcy.`, 'warn', `${K.short} is out of cash.`);
        if (K.debtMonths >= 4) humanBankrupt(S, C, K, hooks);
      } else {
        for (const r of S.routes.filter(r => r.co === id).slice(0, 2)) offerRoute(S, C, r, 0.6);
        if (K.debtMonths >= 2 && S.t - (K.lastIssue || -1e9) > 180) rightsIssue(S, C, K, hooks);
        if (K.debtMonths >= 4) collapse(S, C, id, hooks);
      }
    } else K.debtMonths = 0;
  }
  S.offers = S.offers.filter(o => o.until > S.t && S.cos[o.co]);
  updateCaps(S);
  for (const id in S.cos) { const K = S.cos[id]; K.capHist.push(K.cap); if (K.capHist.length > 24) K.capHist.shift(); }
  for (const K of rivals(S)) {
    // a rival left with no routes for a year winds up and pays its cash out to shareholders
    K.idle = S.routes.some(r => r.co === K.id) ? 0 : (K.idle || 0) + 1;
    if (K.idle >= 12 && S.t - (K.founded || 0) > 365) { windUp(S, C, K, hooks); continue; }
    if (K.payoutBy && K.parent !== K.payoutBy && (K.own[K.payoutBy] || 0) < 0.2 - 1e-9) { K.payout = 0.25; K.payoutBy = null; }
    if (K.siege && S.cos[K.id] && !S.over) siegeMonth(S, C, K, hooks);
  }
  bidsMonth(S, C, hooks);
  if (S.t >= S.nextSpawn && rivals(S).length < S.aiTarget && !S.over) {
    const taken = new Set(rivals(S).map(K => territory(S, C, K)).concat([S.region], humans(S).map(H => H.region)));
    const free = ['na', 'eu', 'ea', 'sas', 'me', 'sa', 'oc'].filter(r => !taken.has(r));
    spawnRival(S, C, null, hooks, free.length ? pick(S, free) : null);
  }
  computeRates(S, C);
  updateCaps(S);
  checkGoals(S, C, hooks);
  if (hooks && hooks.month) hooks.month();
}

// ---------- events ----------
function rollEvent(S, C, hooks) {
  const x = rand(S);
  const dur = (lo, hi) => S.t + lo + rand(S) * (hi - lo);
  const big = C.filter(c => c.pop > 2.5);
  let text = null, e = null;
  if (x < 0.17) {
    const c = pick(S, C.filter(c => GOOD_IDS.some(g => c.supply[g]))); const g = pick(S, GOOD_IDS.filter(g => c.supply[g]));
    e = { type: 'supply', city: c.i, good: g, mult: 1.7, until: dur(240, 420) };
    text = `${CARGO[g].name} boom in ${c.name}: exports up 70%.`;
  } else if (x < 0.34) {
    const c = pick(S, big); const g = pick(S, GOOD_IDS);
    e = { type: 'demand', city: c.i, good: g, mult: 2, until: dur(180, 360) };
    text = `${c.name} is short of ${CARGO[g].name.toLowerCase()}: demand doubled.`;
  } else if (x < 0.47) {
    const c = pick(S, big);
    e = { type: 'pax', city: c.i, mult: 1.5, until: dur(180, 300) };
    text = `Travel surge in ${c.name}: 50% more passengers.`;
  } else if (x < 0.61) {
    const shocks = [['fuel', 0.45, 'Oil price spike. Fuel cargo pays more, and running costs jump.'],
      ['fuel', -0.3, 'Oil glut. Running costs fall, and fuel cargo pays less.'],
      ['tech', 0.4, 'Chip shortage. Electronics shipments pay far more.'],
      ['food', 0.35, 'Drought hits harvests. Food shipments pay more.'],
      ['food', -0.3, 'Bumper harvest. Food prices slump.'],
      ['metals', 0.35, 'Construction boom. Metals prices rally.'],
      ['metals', -0.3, 'Steel glut. Metals prices slump.']];
    const [g, d, t] = pick(S, shocks);
    S.econ.prices[g] = clampN(S.econ.prices[g] + d, 0.55, 1.9);
    text = t;
  } else if (x < 0.69) {
    const g = rand(S) < 0.55 ? 'fuel' : 'metals';
    const c = pick(S, C.filter(c => c.supply[g] < 3 && c.pop > 0.8));
    c.supply[g] += 1;
    text = g === 'fuel' ? `Oil discovered near ${c.name}. Fuel exports rise for good.` : `New mine opens near ${c.name}. Metals exports rise for good.`;
  } else if (x < 0.79) {
    const g = rand(S) < 0.5 ? 'goods' : 'tech';
    const from = C.filter(c => c.supply[g] >= 1 && (c.wv || c.wealth) >= 2.3);
    const to = C.filter(c => c.supply[g] < 3 && (c.wv || c.wealth) < 2.2 && c.pop > 3);
    if (from.length && to.length) {
      const a = pick(S, from), b = pick(S, to);
      a.supply[g] -= 1; b.supply[g] += 1;
      text = `${g === 'tech' ? 'Electronics assembly' : 'Factories'} move from ${a.name} to ${b.name}.`;
    }
  } else if (x < 0.85 && S.routes.some(r => r.mode === 'sea') && !S.events.some(e => e.type === 'canal')) {
    const k = rand(S) < 0.55 ? 'suez' : 'panama';
    e = { type: 'canal', canal: k, mult: 1, until: dur(40, 80) };
    text = k === 'suez' ? 'A grounded ship blocks the Suez Canal. Ships detour around Africa for a couple of months.'
      : 'Drought shuts the Panama Canal to big ships. They detour around South America for a couple of months.';
  } else if (x < 0.92) {
    const c = pick(S, C.filter(c => GOOD_IDS.some(g => c.supply[g]) && c.pop > 1.5));
    e = { type: 'strike', city: c.i, mult: 0.2, until: dur(45, 90) };
    text = `Dock and rail strike in ${c.name}: most freight halted for a couple of months.`;
  } else {
    const c = pick(S, big);
    e = { type: 'grounded', city: c.i, mult: 0.15, until: dur(20, 40) };
    const volcanic = ['Jakarta', 'Surabaya', 'Manila', 'Tokyo', 'Sapporo', 'Mexico City', 'Guatemala City', 'Bogotá', 'Lima', 'Santiago', 'Seattle', 'Auckland', 'Rome', 'Addis Ababa', 'Nairobi'];
    const cause = volcanic.includes(c.name) ? 'Volcanic ash' : c.lat < 30 && c.lat > -30 ? 'A tropical storm' : 'Severe winter storms';
    text = `${cause} ground${cause.endsWith('s') ? '' : 's'} most flights at ${c.name} for a few weeks.`;
  }
  if (!text) return;
  if (e) { e.text = text; S.events.push(e); }
  if (e && e.type === 'canal') rerouteSea(S, C);
  computeRates(S, C);
  log(S, text, 'event');
  if (hooks && hooks.news) hooks.news(text);
}

// ---------- rivals ----------
// Colour slots: rivals take 1, 2, 3, 5, 6; people take 0, 4, 7, 8.
const RIVAL_SLOTS = [1, 2, 3, 5, 6, 9];
function freeSlot(S, skip) {
  const used = new Set(Object.values(S.cos).filter(k => k !== skip).map(k => k.slot));
  return RIVAL_SLOTS.find(s => !used.has(s)) || RIVAL_SLOTS[Object.keys(S.cos).length % RIVAL_SLOTS.length];
}
function spawnRival(S, C, persona, hooks, region) {
  const names = Object.values(S.cos).map(k => k.name).concat(S.gone.map(g => g.name));
  const id = 'r' + (S.nextId++);
  let name, short;
  if (persona) ({ name, short } = PERSONAS[persona]);
  else {
    persona = pick(S, Object.keys(PERSONAS));
    const free = ENTRANTS.filter(e => !names.includes(e[0]));
    [name, short] = free.length ? pick(S, free) : ['Nova Transport ' + (S.entrants + 2), 'Nova'];
    S.entrants++;
  }
  const K = newCompany(id, name, short, { persona, slot: freeSlot(S), cash: 5e6 * diffOf(S).aiCash, founded: S.t, nextExpand: S.t + 20 + rand(S) * 40 });
  // a home base: the airline picks a hub, others a big city in their region (never a player's city)
  const taken = new Set(); for (const H of humans(S)) for (const i of servedCities(S, H.id)) taken.add(i);
  let pool = C.filter(c => c.pop > 3 && (!region || regionOf(c) === region) && !taken.has(c.i));
  if (persona === 'air') pool = C.filter(c => HUBS[c.name] && (!region || regionOf(c) === region));
  if (!pool.length) pool = C.filter(c => c.pop > 4);
  if (persona === 'rail') pool = pool.filter(c => c.land === 'Afro-Eurasia' || c.land === 'North America' || c.land === 'South America');
  // a shipping line sets up in a busy exporting port
  const exporter = c => GOOD_IDS.reduce((s, g) => s + c.supply[g], 0) >= 3;
  if (persona === 'ship') { pool = pool.filter(c => isPort(c.i) && exporter(c)); if (!pool.length) pool = C.filter(c => isPort(c.i) && c.pop > 3 && exporter(c)); }
  K.home = pick(S, pool.length ? pool : C).i;
  K.region = regionOf(C[K.home]);
  S.cos[id] = K;
  // starter route near home. A shipping line starts with a small ship where one pays, otherwise
  // one container ship; anything over its budget is financed by the bank, so every rival starts
  // with about the same net worth.
  const mode = persona === 'air' ? 'air' : persona === 'ship' ? 'sea' : 'road';
  const budget = mode === 'air' ? 14e6 : mode === 'sea' ? 20e6 : 2.4e6;
  const tiers = mode === 'sea' ? [{ cap: 12e6, d: 7000 }, { cap: 40e6, d: 14000 }] : [{ cap: 3e6, d: mode === 'air' ? 1700 : 1400 }];
  let cands = [];
  for (const tier of tiers) {
    for (const c of C) {
      if (c.i === K.home) continue;
      const d = gcDist(C[K.home], c);
      if (d > tier.d || routeProblem(S, C, mode, K.home, c.i) || !rivalMayServe(S, C, K, mode, K.home, c.i)) continue;
      // range is checked on the real route (a sea lane can be far longer than the straight line)
      const rd = routeDist(C, mode, K.home, c.i, S);
      let o = null;
      for (const m of MODELS.filter(m => m.mode === mode && m.year <= 2026 && m.cost <= tier.cap && rd <= m.range)) {
        const e = bestCount(S, C, id, mode, K.home, c.i, m.id, 12, null, PERSONAS[persona].fare);
        if (!o || e.profitYr > o.profitYr) o = e;
      }
      if (o && o.profitYr > 0) cands.push({ o, b: c.i });
    }
    if (cands.length) break;
  }
  cands.sort((x, y) => y.o.profitYr - x.o.profitYr);
  if (cands.length) {
    const first = Math.min(cands.length - 1, Math.floor(rand(S) * 3));
    for (const { o, b } of [cands[first]].concat(cands.filter((x, i) => i !== first))) {
      const setup = setupCost(S, C, id, mode, K.home, b).reduce((s, x) => s + x.cost, 0);
      const n = Math.max(1, Math.min(o.n, Math.floor((budget - setup) / o.model.cost)));
      const cash = K.cash; K.cash = 1e12;
      const res = openRoute(S, C, id, mode, K.home, b, o.model.id, n, PERSONAS[persona].fare);
      K.cash = cash; K.ledger.cur.capex = 0;
      if (!res.ok) continue;
      const spent = setup + n * o.model.cost;
      if (spent > budget) K.loan += spent - budget;
      break;
    }
  }
  S.nextSpawn = S.t + 720;
  updateCaps(S);
  if (S.t > 1) {
    const text = `New rival: ${name}, based in ${C[K.home].name}.`;
    log(S, text, 'rival', id);
    if (hooks && hooks.news) hooks.news(text);
  }
  return K;
}

function rivalCandidates(S, C, K, count) {
  const P = PERSONAS[K.persona];
  const sub = !!K.parent;
  const served0 = [...servedCities(S, K.id)].filter(i => inTerritory(S, C, K, i));
  const origins = served0.length ? served0.concat([K.home, K.home]) : [K.home];
  const out = [];
  const modes = Object.keys(P.modes).filter(m => P.modes[m] > 0);
  const pickMode = () => { let x = rand(S), acc = 0; for (const m of modes) { acc += P.modes[m]; if (x <= acc) return m; } return modes[0]; };
  const D = diffOf(S);
  // Normal and Hard: go after the most profitable routes players run wherever this rival may operate
  if (!sub && D.compete > 0 && S.t > D.grace && rand(S) < Math.min(0.9, (0.3 + 0.5 * P.attack) * D.compete)) {
    const mine = new Set(S.routes.filter(x => x.co === K.id).map(x => x.mode + pairKey(x.a, x.b)));
    const targets = S.routes.filter(r => isHuman(S, r.co) && r.v.length && r.hist.length >= 3 && P.modes[r.mode] >= 0.1
      && !mine.has(r.mode + pairKey(r.a, r.b)) && rivalMayServe(S, C, K, r.mode, r.a, r.b))
      .map(r => ({ r, p: r.hist.slice(-6).reduce((s, v) => s + v, 0) }))
      .filter(x => x.p > 0).sort((x, y) => y.p - x.p).slice(0, 3);
    for (const { r } of targets) out.push({ mode: r.mode, a: r.a, b: r.b, attack: true });
  } else if (!sub && D.compete === 0 && S.t > 365 && rand(S) < P.attack * 0.5) {
    // Easy: only fight your routes when they come into cities this rival already serves at home
    const crowded = r => S.routes.some(x => !isHuman(S, x.co) && x.mode === r.mode && pairKey(x.a, x.b) === pairKey(r.a, r.b));
    const served = new Set(served0);
    const invading = S.routes.filter(r => isHuman(S, r.co) && P.modes[r.mode] >= 0.3 && r.hist.length >= 3 && !crowded(r)
      && rivalMayServe(S, C, K, r.mode, r.a, r.b)
      && [r.a, r.b].some(i => inTerritory(S, C, K, i) && (served.has(i) || i === K.home)))
      .sort((x, y) => y.hist.reduce((s, v) => s + v, 0) - x.hist.reduce((s, v) => s + v, 0)).slice(0, 2);
    for (const r of invading) out.push({ mode: r.mode, a: r.a, b: r.b, attack: true });
  }
  const home = C.filter(c => inTerritory(S, C, K, c.i)).map(c => c.i);
  let guard = 0;
  while (out.length < count && guard++ < count * 6) {
    const mode = pickMode();
    const a = (K.persona === 'air' || K.persona === 'ship') && rand(S) < 0.7 ? K.home : pick(S, origins);
    const maxD = mode === 'road' ? 1500 : mode === 'rail' ? 2200 : mode === 'sea' ? 20000 : 12000;
    const b = mode === 'sea' ? (rand(S) < 0.6 ? pick(S, PORT_IDS()) : pick(S, home))
      : mode === 'air' && rand(S) < 0.5 ? Math.floor(rand(S) * C.length) : pick(S, home);
    if (mode === 'sea' && (!isPort(a) || !isPort(b))) continue;
    if (b === a || gcDist(C[a], C[b]) > maxD || !rivalMayServe(S, C, K, mode, a, b)) continue;
    // Easy: stay out of markets you run unless they touch this rival's turf
    if (humanRoute(S, mode, a, b) && (sub || S.t < D.grace || (D.compete === 0 && ![a, b].some(i => inTerritory(S, C, K, i) && served0.includes(i))))) continue;
    out.push({ mode, a, b });
  }
  return out;
}

function rivalMonth(S, C, K, hooks) {
  const P = PERSONAS[K.persona];
  const book = Math.max(0, companyValue(S, K.id));
  const reserve = Math.max(1e6, 0.06 * book);
  if (K.cash < 0) borrow(S, K.id, Math.ceil(-K.cash / 1e5) * 1e5 + 5e5);
  const mine = S.routes.filter(r => r.co === K.id);
  // fleet tuning
  for (const r of mine.sort(() => rand(S) - 0.5).slice(0, 4)) {
    const groups = {};
    for (const v of r.v) groups[v.m] = (groups[v.m] || 0) + 1;
    const main = Object.entries(groups).sort((x, y) => y[1] - x[1])[0];
    if (!main) { closeRoute(S, C, r); continue; }
    const [mid, cur] = main;
    const now = estimate(S, C, K.id, r.mode, r.a, r.b, mid, cur, r.id, r.fare);
    const best = bestCount(S, C, K.id, r.mode, r.a, r.b, mid, 40, r.id, r.fare);
    if (best.n > cur && best.profitYr > now.profitYr * 1.05 + 3e4) {
      const add = Math.min(best.n - cur, 3, Math.floor((K.cash - reserve) / MODEL[mid].cost), slotRoom(S, C, r.mode, r.a, r.b));
      if (add > 0) buyVehicles(S, C, r, mid, add);
    } else if (best.n < cur - 1) sellVehicle(S, C, r, mid);
    // losing money for months: sell it or shut it
    const recent = r.hist.slice(-5);
    if (recent.length >= 5 && recent.reduce((s, x) => s + x, 0) < 0 && S.t - r.opened > 200) {
      if (!S.offers.some(o => o.routeId === r.id) && rand(S) < 0.6) offerRoute(S, C, r, 0.75);
      else if (r.hist.slice(-8).length >= 8 && r.hist.slice(-8).reduce((s, x) => s + x, 0) < 0) closeRoute(S, C, r);
    }
  }
  // price reactions where it competes
  for (const r of S.routes.filter(r => r.co === K.id)) {
    const sh = routeShare(S, r)[K.id];
    if (!sh) continue;
    const kind = r.v.length && MODEL[r.v[0].m].kind;
    const share = kind ? sh[kind] : 1;
    const contested = Object.keys(routeShare(S, r)).length > 1;
    const vsYou = contested && humanRoute(S, r.mode, r.a, r.b);
    if (vsYou && K.parent) continue;
    if (contested && share < 0.45 && r.fare > 0 && rand(S) < (K.siege && vsYou ? 0.9 : P.attack)) {
      setFare(S, C, r, r.fare - 1);
      if (vsYou) {
        const text = `${K.short} cut fares to ${FARES[r.fare].name.toLowerCase()} on ${C[r.a].name} – ${C[r.b].name}.`;
        logTo(S, vsYou.co, text, 'war', text);
        if (hooks && hooks.news) hooks.news(text, 'war', vsYou.co);
      }

function checkGoals(S, C, hooks) {
  for (const K of humans(S)) {
    for (const g of GOALS) {
      if (K.pd.goals[g.id]) continue;
      if (g.check(S, C, K)) {
        K.pd.goals[g.id] = S.t || 0.001;
        if (g.reward) { K.cash += g.reward; K.ledger.cur.reward += g.reward; }
        const txt = g.reward ? `Goal reached: ${g.title}. Bonus ${fmtMoney(g.reward)}.` : `Goal reached: ${g.title}.`;
        logTo(S, K.id, txt, 'goal', `${K.short} reached a goal: ${g.title}.`);
        if (hooks && hooks.goal) hooks.goal(g, txt, K.id);
        if (g.final && hooks && hooks.victory) hooks.victory(K.id);
      }
    }
  }
}

function advance(S, C, dt, hooks) {
  if (S.over) return;
  const target = S.t + dt;
  while (S.t < target - 1e-9 && !S.over) {
    const nextDay = Math.floor(S.t + 1e-9) + 1;
    const step = Math.min(target, nextDay);
    for (const r of S.routes) {
      if (!S.cos[r.co]) continue;
      for (const v of r.v) {
        let guard = 0;
        while (v.t1 <= step && guard++ < 50) {
          if (v.p === 0) depart(S, C, r, v); else arrive(S, C, r, v, hooks);
        }
      }
    }
    S.t = step;
    if (Math.abs(step - nextDay) < 1e-9) daily(S, C, hooks);
  }
}

  const inR = C.filter(test);

  const setup = 2 * MODES.road.term.cost;
  const opts = [];
  for (const A of inR) for (const B of inR) {
    if (A.i >= B.i || routeProblem(S, C, 'road', A.i, B.i)) continue;
    const d = gcDist(A, B);
    if (d < 200 || d > 2300) continue;
    let best = null;
    for (const m of models) {
      for (let n = 2; setup + n * m.cost <= STARTER_BUDGET; n++) {

        if (e.profitYr > STARTER_TARGET * 1.3) break;

// Start a new world: the player plus three rivals.

// Another human joins: a fresh company with a fair starter route in their chosen region.
function addHuman(S, C, id, name, region) {

  const slot = [4, 7, 8, 9].find(x => !used.has(x)) || 8;
  const K = newHumanCompany(id, name, slot);
  setFounders(S, K);
  K.region = REGION_TEST[region] ? region : null;
  K.joined = S.t;
  S.cos[id] = K;
  const st = K.region ? pickStarter(S, C, K.region, id) : null;
  if (st) {
    K.cash = 1e12;
    openRoute(S, C, id, 'road', st.a, st.b, st.model, st.n, 1);
    K.cash = START_TOTAL - st.cost; K.ledger.cur.capex = 0;

// ===================== Great Circle Tycoon: live multiplayer =====================
// Friends share one world, each running a company. One player's page is the host: it runs the
// clock, applies everyone's commands in order and saves the world to the artifact's shared
// database every few seconds. Every other page runs the same simulation, replays the host's
// commands as they arrive and reloads the host's saved copy whenever a newer one lands, so small
// drifts never last. If the host's page closes, another player's page takes over within seconds.
// All game rules live in applyCmd(), so a turn-based mode could later reuse the same commands.

const CODE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
const NET = {
  on: false, ready: false, init: null, db: null, room: null, user: null, R: null,
  pid: null, uid: null, canWrite: null, code: null, meta: null, host: false,
  tab: rid(10), pending: [], cseq: 0, acts: [], unsub: [],
  tickAt: 0, hostT: 0, lastTickSent: 0, nextLease: 0, leaseUntil: 0, nextHostTry: 0, hostTry: false,
  snapV: 0, headV: 0, snapDue: 0, writing: false, loading: null, loadNext: null, saveErr: 0, metaAt: 0,
  lastSync: 0, lastPull: 0, joinWait: null, connected: false, dead: null, onReady: null,
};
const PID_KEY = 'gct.pid';
const SNAP_CHUNK = 150000;
const LEASE_MS = 9000;      // a host that stops renewing loses the clock within seconds
const MAX_PLAYERS = 4;

function rid(n) {
  const a = new Uint8Array(n);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256; });
  return Array.from(a, x => CODE_CHARS[x % CODE_CHARS.length]).join('');
}
const gamePath = () => 'games/' + NET.code;
const snapPath = d => `games/${NET.code}/snap/${d}`;
const cleanName = s => String(s || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 28);
const netAvailable = () => !!(NET.ready && NET.db && NET.room && NET.pid);
// the live company a player runs, if any
const companyOf = (W, pid) => W && Object.values(W.cos).find(K => K.human && !K.lost && K.pid === pid);
function lastCompanyOf(W, pid) {
  const ks = Object.values(W.cos).filter(K => K.human && K.pid === pid).sort((a, b) => (b.joined || 0) - (a.joined || 0));
  return ks.length ? ks[0].id : null;
}

// ---------- capabilities ----------
function netInit() {
  if (NET.init) return NET.init;
  NET.init = (async () => {
    const C = window.claude;
    const use = name => (C && typeof C.use === 'function') ? Promise.resolve().then(() => C.use(name)).catch(() => null) : Promise.resolve(null);
    const [db, room, user] = await Promise.all([use('db'), use('room'), use('user')]);
    Object.assign(NET, { db, room, user });
    let uid = null;
    if (user) { try { uid = await user.id(); } catch (e) { /* no identity here */ } try { NET.canWrite = await user.can('data.write'); } catch (e) { /* not told */ } }
    NET.uid = uid || null;
    // a player is known by their account id where the page gets one, otherwise by a key kept on this device
    let pid = null;
    try { pid = localStorage.getItem(PID_KEY); } catch (e) { /* no storage */ }
    if (uid) pid = 'u-' + uid;
    else if (!pid) { pid = 'd-' + rid(12); try { localStorage.setItem(PID_KEY, pid); } catch (e) { /* no storage */ } }
    NET.pid = pid;
    NET.ready = true;
    const f = NET.onReady; NET.onReady = null;
    if (f) f();
  })();
  return NET.init;
}

  if (!NET.on || !NET.host || !S) return;
  NET.snapDue = 0;
  writeSnap();
  emit('tick', { t: S.t, sp: speed, seq: S.seq || 0, ver: NET.snapV, tab: NET.tab, since: NET.since, bye: 1 });
  if (NET.db) NET.db.doc(gamePath() + '/lock/host').acquire({ holder: NET.tab, ttlMs: 1000 }).catch(() => {});
  stepDown(3500);
}
function netVisible() {
  if (NET.on && !NET.host) NET.nextHostTry = Math.max(NET.nextHostTry, performance.now() + 3500);
}
function checkFate() {
  const K = me();
  if (S.over && !ui.overShown) { ui.overShown = true; showFate(); return; }
  if (K && K.lost && !ui.fateShown && !NET.joinWait) { ui.fateShown = true; showFate(); }
}

// ---------- presence ----------
function netPresence() { if (NET.R) NET.R.presence({ pid: NET.pid, co: MY || null, host: NET.host ? 1 : 0 }).catch(() => {}); }
function onlinePids() {
  const out = new Set();
  if (NET.R) for (const p of NET.R.peers()) if (p.presence && typeof p.presence.pid === 'string') out.add(p.presence.pid);
  return out;
}
function updateMpPill() {
  const el = $('mpPill');
  if (!NET.on) { el.hidden = true; return; }
  const live = NET.host || (NET.tickAt && performance.now() - NET.tickAt < 4000);
  const n = onlinePids().size || 1;
  el.dataset.state = NET.dead ? 'off' : live ? 'live' : 'wait';
  el.querySelector('span').textContent = NET.dead ? 'Offline' : `${(NET.code || '').toUpperCase()} · ${n} online`;
}
setInterval(() => { if (NET.on) updateMpPill(); }, 2000);

}

async function listMyGames() {
  let rows = [];
  try {
    const q = await NET.db.collection('games').where('pids', 'array-contains', NET.pid).limit(30).get();
    rows = q.docs.map(d => d.data()).filter(g => g && g.code).sort((a, b) => String(b.upd || '').localeCompare(String(a.upd || '')));
  } catch (e) { rows = null; }
  const box = $('mpMine');
  if (!box) return;
  const last = prefs().mpCode;
  if (!rows) { box.innerHTML = '<p class="small muted" style="margin:0">Your games could not be listed right now. You can still join with a code.</p>'; return; }
  if (!rows.length) { box.innerHTML = `<p class="small muted" style="margin:0">None yet. Games you start or join show up here.${last ? ` Last one: ${esc(last.toUpperCase())}.` : ''}</p>`; return; }
  box.innerHTML = `<div class="rows">${rows.slice(0, 8).map(g => {
    const mine = (g.players || []).filter(p => p.pid === NET.pid);
    const me_ = mine.find(p => !p.out) || mine[0];
    const others = (g.players || []).filter(p => p.pid !== NET.pid && !p.out).map(p => p.name);
    const d = dateOf(g.t || 0);
    return `<button class="row" data-mpopen="${esc(g.code)}"><span class="grow"><span class="t" style="display:block">${esc(g.code.toUpperCase())} · ${esc(me_ ? me_.name : 'Watching')}${me_ && me_.out ? ' (out)' : ''}</span>

  }).join('')}</div>`;
}

// Taken over or bankrupt in a shared game: watch, start again or leave.
function showFate() {
  const ov = $('overlay');
  const K = me();
  const d = dateOf(S.t), when = `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  let body;
  if (S.over) body = `<h1 class="brand">Game <em>over</em></h1><p class="lede">Every player's company has been taken over or gone bankrupt. The computer rivals own the world now.</p>`;
  else {
    const out = (K && K.out) || { type: 'bankrupt' };
    const tot = K ? K.pd.totals : { pax: 0, tons: 0 };
    body = out.type === 'sold'
      ? `<h1 class="brand">Sold</h1><p class="lede">You sold ${esc(K ? K.name : 'your company')} to ${esc(out.by)} in ${when} for ${fmtMoney(out.price || 0)}. Along the way it carried ${carried(tot)}.</p>`
      : out.type === 'takeover'
      ? `<h1 class="brand">Taken <em>over</em></h1><p class="lede">${esc(out.by)} bought 51% of ${esc(K ? K.name : 'your company')} in ${when}. Its routes and fleet now fly their colours. Along the way you carried ${carried(tot)}.</p>`
      : `<h1 class="brand">Bankrupt</h1><p class="lede">${esc(K ? K.name : 'Your company')} ran out of cash and credit in ${when}. It carried ${carried(tot)}.</p>`;
  }
  const canRestart = !S.over && humans(S).length < MAX_PLAYERS;
  ov.innerHTML = `<div class="card" role="dialog">${body}
    ${canRestart ? `<p class="small" style="margin:0">The game goes on. Start a new company in this world, or keep watching.</p>${nameField('againName', randomName())}${regionButtons('data-again')}` : ''}
    <div class="btn-row"><button class="btn btn-ghost" data-act="watch">Keep watching</button><button class="btn btn-ghost" data-act="leave">Leave game</button></div></div>`;
  ov.hidden = false;
  ov.onclick = e => {
    const t = e.target;
    if (t.closest('[data-act="watch"]')) { ov.hidden = true; return; }
    if (t.closest('[data-act="leave"]')) { mpLeave(); return; }
    if (t.closest('[data-act="rename-random"]')) { const i = $('againName'); i.value = randomName(); i.focus(); return; }

      const c = { type: 'join', name: cleanName($('againName').value) || randomName(), region: reg.dataset.again };
      NET.joinWait = { c, at: performance.now(), tries: 0 };
      showJoining();
      sendCmd(c);
    }
  };
}

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function mercXY(lon, lat) {
  lat = clamp(lat, -84, 84);

function decodePath(rings, close) {
  const p = new Path2D();
  for (const r of rings) {
    let x = r[0], y = r[1];
    p.moveTo(x / 2, y / 2);
    for (let i = 2; i < r.length; i += 2) { x += r[i]; y += r[i + 1]; p.lineTo(x / 2, y / 2); }
    if (close) p.closePath();
  }
  return p;
}
const LAND = decodePath(MAPDATA.land, true);
const BORDERS = decodePath(MAPDATA.borders, false);
const GRAT = (() => {
  const p = new Path2D();
  const [, yN] = mercXY(0, 84), [, yS] = mercXY(0, -58);
  for (let lon = -180; lon < 180; lon += 15) { const [x] = mercXY(lon, 0); p.moveTo(x, yN); p.lineTo(x, yS); }
  for (let lat = -45; lat <= 75; lat += 15) { const [, y] = mercXY(0, lat); p.moveTo(0, y); p.lineTo(MW, y); }
  return p;
})();

function zMin() { return vw / MW; }
// The part of the screen the map can be seen in: below the HUD (and hint), above the dock
// or bottom sheet on phones, left of the side sheet on wide screens.
function visibleBox() {

  let t = hudBottom + 8, b = vh - 8, l = 8, r = vw - 8;

  else b = (sheet.hidden ? dock.offsetTop : sheet.offsetTop) - 8;

let camAnim = null;
function flyTo(x, y, z, ms) {
  if (ms == null) ms = 480;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0;
  const dx = ((((x - cam.x) % MW) + MW * 1.5) % MW) - MW / 2; // the short way round the globe
  if (!ms) { camAnim = null; cam.x += dx; cam.y = y; cam.z = z; clampCam(); return; }
  camAnim = { x0: cam.x, y0: cam.y, z0: cam.z, dx, y1: y, z1: z, t0: performance.now(), ms };
}
function stepCam(now) {
  const A = camAnim;

  const k = clamp((now - A.t0) / A.ms, 0, 1), e = 1 - Math.pow(1 - k, 3);
  cam.z = A.z0 * Math.pow(A.z1 / A.z0, e);

}
// Frame a box of map coordinates in the visible area. keepZoom: zoom out if needed, never in.
function fitView(minX, maxX, minY, maxY, opt) {
  opt = opt || {};
  const B = visibleBox(), pad = opt.pad == null ? 0.18 : opt.pad;
  const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
  let z = Math.min((B.r - B.l) / (w * (1 + 2 * pad)), (B.b - B.t) / (h * (1 + 2 * pad)));
  z = clamp(z, zMin(), Math.min(2.4, (opt.maxF || 1e9) * zMin()));

  flyTo(mx - ((B.l + B.r) / 2 - vw / 2) / z, my - ((B.t + B.b) / 2 - vh / 2) / z, z, opt.ms);

// Move the map only if the box is not already in view.
function ensureVisible(g) {

  const l = sx(g.minX + k * MW), r = sx(g.maxX + k * MW), t = sy(g.minY), b = sy(g.maxY);
  if (l >= B.l && r <= B.r && t >= B.t && b <= B.b) return;

// px of map hidden under a bottom sheet on phones; the map may scroll up by that much

function clampCam() {

// ---------- route geometry ----------
const geoCache = new Map();
function geoFor(a, b, wps) {
  const key = a + '>' + b + (wps && wps.length ? '>' + wps.join('/') : '');
  if (geoCache.has(key)) return geoCache.get(key);
  const stops = [CITY[a]].concat((wps || []).map(([lat, lon]) => ({ lat, lon })), [CITY[b]]);
  let ll = [];
  for (let i = 1; i < stops.length; i++) {
    const d = gcDist(stops[i - 1], stops[i]);
    const seg = gcPoints(stops[i - 1], stops[i], clamp(Math.ceil(d / 120), 2, 90));
    ll = ll.concat(i > 1 ? seg.slice(1) : seg);
  }
  for (let i = 1; i < ll.length; i++) { while (ll[i][0] - ll[i - 1][0] > 180) ll[i][0] -= 360; while (ll[i][0] - ll[i - 1][0] < -180) ll[i][0] += 360; }
  const pts = ll.map(([lon, lat]) => mercXY(lon, lat));
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of pts) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const g = { pts, minX, maxX, minY, maxY };
  geoCache.set(key, g);
  return g;
}
function tracePath(g, k, nudge) {
  ctx.beginPath();
  const off = k * MW;
  for (let i = 0; i < g.pts.length; i++) {
    const x = sx(g.pts[i][0] + off) + (nudge || 0), y = sy(g.pts[i][1]) + (nudge || 0);
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
}

// ---------- drawing ----------
function drawBase() {
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.fillStyle = COL.sea;
  bctx.fillRect(0, 0, base.width, base.height);
  const z = cam.z;
  for (const k of copies(MAPDATA.minX, MAPDATA.maxX, 0, MH)) {
    bctx.setTransform(z * dpr, 0, 0, z * dpr, sx(k * MW) * dpr, sy(0) * dpr);
    bctx.lineWidth = 1 / z; bctx.strokeStyle = COL.grat; bctx.stroke(GRAT);
    bctx.fillStyle = COL.land; bctx.fill(LAND);
    bctx.lineJoin = 'round';
    bctx.lineWidth = 0.9 / z; bctx.strokeStyle = COL.coast; bctx.stroke(LAND);
    bctx.lineWidth = 0.7 / z; bctx.strokeStyle = COL.border; bctx.stroke(BORDERS);
  }
}

function strokeRoute(g, mode, k, emph) {
  tracePath(g, k);
  ctx.setLineDash([]);
  if (emph) {
    ctx.globalAlpha = 0.22; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.strokeStyle = modeCol(mode); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (mode === 'road') {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 5; ctx.strokeStyle = COL.halo; ctx.stroke();
    ctx.lineWidth = 2.6; ctx.strokeStyle = COL.road; ctx.stroke();
  } else if (mode === 'rail') {
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.lineWidth = 2.2; ctx.strokeStyle = COL.rail; ctx.stroke();
    ctx.setLineDash([1.6, 6]); ctx.lineWidth = 7.5; ctx.stroke();
    ctx.setLineDash([]);
  } else if (mode === 'sea') {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([10, 7]); ctx.lineWidth = 4.6; ctx.strokeStyle = COL.halo; ctx.stroke();
    ctx.lineWidth = 2.2; ctx.strokeStyle = COL.ship; ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.lineCap = 'round';
    ctx.setLineDash([6, 5]); ctx.lineWidth = 1.7; ctx.strokeStyle = COL.air; ctx.stroke();
    ctx.setLineDash([]);
  }
}
// rivals draw thinner, in their company colour, offset a hair so shared corridors stay visible
function strokeRival(g, mode, k, color, emph) {
  tracePath(g, k, 2.5);
  ctx.setLineDash([]);
  ctx.strokeStyle = color;
  if (emph) { ctx.globalAlpha = 0.25; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke(); }
  ctx.globalAlpha = 0.85;
  if (mode === 'road') { ctx.lineCap = 'round'; ctx.lineWidth = 1.7; ctx.stroke(); }
  else if (mode === 'rail') { ctx.lineCap = 'butt'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([1.2, 4.5]); ctx.lineWidth = 5; ctx.stroke(); }
  else if (mode === 'sea') { ctx.lineCap = 'round'; ctx.setLineDash([8, 6]); ctx.lineWidth = 1.5; ctx.stroke(); }
  else { ctx.lineCap = 'round'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1.3; ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawRoutes() {
  const order = { sea: 0, air: 1, rail: 2, road: 3 };
  const sel = ui.sel && (ui.sel.type === 'route' || ui.sel.type === 'rroute') ? ui.sel.id : null;
  if (ui.showRivals) {
    for (const r of S.routes) {
      if (r.co === MY || !r.v.length) continue;
      const g = geoFor(r.a, r.b, r.wps);
      for (const k of copies(g.minX, g.maxX, g.minY, g.maxY)) strokeRival(g, r.mode, k, coColor(r.co), sel === r.id);
    }
  }
  const rs = S.routes.filter(r => r.co === MY).sort((p, q) => order[p.mode] - order[q.mode]);
  for (const r of rs) {
    const g = geoFor(r.a, r.b, r.wps);
    for (const k of copies(g.minX, g.maxX, g.minY, g.maxY)) strokeRoute(g, r.mode, k, sel === r.id);
  }
  if ((ui.step === 'plan') && ui.a != null && ui.b != null) {
    const g = planGeo();
    for (const k of copies(g.minX, g.maxX, g.minY, g.maxY)) {
      tracePath(g, k);
      ctx.setLineDash([3, 5]); ctx.lineCap = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = modeCol(ui.mode); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

function vehicleScale() { return clamp(0.72 + 0.14 * Math.log2(cam.z / zMin()), 0.72, 1.3); }

function openWarSheet() {

      <div class="stat"><b>${Math.round(r.load * 100)}%</b><span>Load</span></div><div class="stat"><b>${r.v.length}</b><span>Vehicles</span></div><div class="stat"><b>${fmtMoney(r.life.rev)}</b><span>Earned</span></div></div>
    ${r.hist.length ? `<div class="section"><h3>Monthly profit</h3>${barsSvg(r.hist, 12)}</div>` : ''}

function barsSvg(vals, n) {
  const data = vals.slice(-n);
  const w = 320, h = 96, pad = 16;
  const max = Math.max(1, ...data.map(Math.abs));
  const hasNeg = data.some(v => v < 0);
  const zero = hasNeg ? h / 2 : h - pad;
  const scale = (hasNeg ? h / 2 - 12 : h - pad - 14) / max;
  const bw = (w - 8) / n;
  const bars = data.map((v, i) => {
    const bh = Math.max(1, Math.abs(v) * scale);
    const x = 4 + (n - data.length + i) * bw + 2, y = v >= 0 ? zero - bh : zero;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="var(${v >= 0 ? '--good' : '--bad'})"/>`;
  }).join('');
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Monthly profit, most recent on the right">
    <line x1="0" x2="${w}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>${bars}
    <text x="2" y="10" font-size="10" fill="var(--muted)" font-family="Barlow Semi Condensed, sans-serif">${fmtMoney(max)}</text></svg>`;
}

function hubSection(i) {

    ${prob && legs.length >= HUB.minRoutes ? `<div class="warn">${esc(prob)}</div>` : ''}

    ${top.length ? `<div class="section"><h3>${isMe ? 'Your best routes' : 'Their best routes'}</h3><div class="rows">${top.map(({ r, p }) => `<button class="row" data-act="${isMe ? 'route' : 'rroute'}" data-id="${r.id}">${modeIco(r.mode)}<span class="grow"><span class="t" style="display:block">${esc(CITY[r.a].name)} – ${esc(CITY[r.b].name)}</span><span class="s">${esc(fleetText(r))} · ${FARES[r.fare].name.toLowerCase()}</span></span><span class="v">${money(p)}</span></button>`).join('')}</div></div>` : ''}`);
}
function paySeg(opts, cur, id) {
  return `<div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)" role="group" aria-label="Dividend payout">${opts.map(v => `<button data-act="payout" data-id="${id}" data-v="${v}" aria-pressed="${Math.abs((cur || 0) - v) < 1e-6}">${Math.round(v * 100)}%</button>`).join('')}</div>`;
}

      }
    } else if (pr.status === 'building') {

      status = `${who}: ${pr.done} of ${p.months} months.${meter(pr.done / p.months * 100)}`;
