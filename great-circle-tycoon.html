      <p class="small" style="margin:0">${esc(p.blurb)}</p><div class="small">${status}</div>
      <div class="btn-row">${action}<button class="btn btn-ghost" data-act="show-project" data-p="${p.id}">Show on map</button></div></article>`;

  setSheet('projects', 'Late game', 'Megaprojects', `<p class="small muted" style="margin:0">Bridges and tunnels that join landmasses, so road and rail can run where only planes could. The owner charges a ${Math.round(TOLL_RATE * 100)}% toll on every other company's traffic across it. Rivals with deep pockets may build the ones in their own region.</p>
    <div class="wars">${cards}</div>`);
}

      <tr><td>Fuel and running costs</td><td>${fmtMoney(-sum('run'))}</td></tr>${sum('tollOut') ? `<tr><td>Tolls paid</td><td>${fmtMoney(-sum('tollOut'))}</td></tr>` : ''}<tr><td>Vehicle upkeep</td><td>${fmtMoney(-sum('maint'))}</td></tr>
      <tr><td>Terminals and track</td><td>${fmtMoney(-sum('infra'))}</td></tr>${diffOf(S).office ? `<tr><td>Head office</td><td>${fmtMoney(-sum('office'))}</td></tr>` : ''}<tr><td>Loan interest</td><td>${fmtMoney(-sum('interest'))}</td></tr>

// ---------- goals ----------
// The best first rail line or shipping line from cities you already serve, sized to your budget.
function starterIdea(mode) {
  const k = S.lastMonth + '|' + routeCount(S, MY) + '|' + Math.round(budgetNow() / 5e5);
  ui.ideas = ui.ideas || {};
  if (ui.ideas[mode] && ui.ideas[mode].k === k) return ui.ideas[mode].v;
  const B = budgetNow();
  const origins = [...servedCities(S, MY)].filter(i => mode !== 'sea' || isPort(i)).sort((p, q) => CITY[q].pop - CITY[p].pop).slice(0, 6);
  let best = null;
  for (const a of origins) for (const c of CITY.filter(c => {
    if (c.i === a) return false;
    const d = gcDist(CITY[a], c);
    return mode === 'rail' ? d <= 1600 && d >= 80 && c.land === CITY[a].land : isPort(c.i) && d <= 6000;
  }).sort((p, q) => q.pop - p.pop).slice(0, 25)) {
    const o = opportunity(S, CITY, MY, mode, a, c.i, 1, B);
    if (!o || o.profitYr <= 0) continue;
    const x = { a, b: c.i, o, over: !!o.over, roi: o.profitYr / o.capex };
    if (!best || (best.over && !x.over) || (best.over === x.over && (x.over ? x.o.capex < best.o.capex : x.roi > best.roi))) best = x;
  }
  ui.ideas[mode] = { k, v: best };
  return best;
}
function ideaHtml(mode) {
  const x = starterIdea(mode);
  if (!x) return `<span class="s">No ${mode === 'sea' ? 'shipping' : 'rail'} line pays from your cities yet.</span>`;
  const what = `${esc(CITY[x.a].name)} – ${esc(CITY[x.b].name)}`;
  return `<button class="try ${x.over ? 'later' : ''}" data-act="goal-try" data-m="${mode}" data-a="${x.a}" data-b="${x.b}">${x.over ? `Closest to reach: ${what}, needs ${fmtMoney(x.o.capex)}` : `Try ${what}: ${fmtMoney(x.o.capex)}, about ${fmtMoney(x.o.profitYr)} a year`}</button>`;
}
function openGoalsSheet() {
  const MG = me().pd.goals;
  ui.seenGoals = Object.keys(MG).length; updateBadges();
  const fmtP = (g, v) => g.money ? fmtMoney(v) : g.pct ? fmtPct(v) : Math.round(v).toLocaleString('en-US');
  const tiers = [1, 2, 3, 4].map(t => {
    const gs = GOALS.filter(g => g.tier === t);
    const done = gs.filter(g => MG[g.id]).length;
    const rows = gs.map(g => {
      const ok = !!MG[g.id];
      let pr = '';
      if (!ok && g.prog) { const [c, n] = g.prog(S, CITY, me()); pr = `<div class="meter"><i style="width:${clamp(c / n * 100, 0, 100).toFixed(1)}%"></i></div><span class="s">${fmtP(g, c)} of ${fmtP(g, n)}</span>`; }
      if (!ok && (g.id === 'rail' || g.id === 'ship')) pr += ideaHtml(g.id === 'rail' ? 'rail' : 'sea');
      return `<div class="row goal ${ok ? 'done' : ''}"><span class="ck">${ok ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.6 9.6 3.6"/></svg>' : ''}</span>
        <span class="grow"><span class="t" style="display:block;white-space:normal">${esc(g.title)}</span>${g.reward ? `<span class="s">Bonus ${fmtMoney(g.reward)}</span>` : '<span class="s">The finish line</span>'}${pr}</span></div>`;
    }).join('');
    return `<div class="section"><h3>${TIERS[t]} · ${done}/${gs.length}</h3><div class="rows">${rows}</div></div>`;
  }).join('');
  const n = Object.keys(MG).length;
  setSheet('goals', `${n} of ${GOALS.length} reached`, 'Goals', `${tiers}
    <div class="section"><h3>Tips</h3><p class="small muted" style="margin:0">Pair exporters with cities that need what they make. Own 51% of yourself and no rival can take you. Stakes in rivals pay dividends; a 20% board seat lets you demand more. If a rival is locked up, launch a hostile bid and beat it on routes in its home region. Megaprojects open new ground routes and earn tolls.</p></div>`);
}

// ---------- sheet actions ----------
sheetBody.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || !S || !me()) return;
  const what = el.dataset.act;
  const r = ui.sel && ui.sel.type === 'route' ? S.routes.find(x => x.id === ui.sel.id) : null;
  switch (what) {
    case 'mode': chooseMode(el.dataset.mode); break;
    case 'from-city': chooseMode(el.dataset.mode, ui.sel.id); break;
    case 'back-pick': backToPick(); break;
    case 'switch-air': { const b = ui.b; ui.mode = 'air'; ui.opp = computeOpp('air', ui.a); openPlanner(b); break; }
    case 'model': { ui.plan.model = el.dataset.model; const be = bestCount(S, CITY, MY, ui.mode, ui.a, ui.b, ui.plan.model, 40, null, ui.plan.fare); ui.plan.n = be.n; renderPlanner(); break; }
    case 'plan-fare': {
      ui.plan.fare = +el.dataset.fare;
      if (ui.plan.model) ui.plan.n = bestCount(S, CITY, MY, ui.mode, ui.a, ui.b, ui.plan.model, 40, null, ui.plan.fare).n;
      renderPlanner(); break;
    }
    case 'n': ui.plan.n = clamp(ui.plan.n + +el.dataset.d, 1, Math.min(99, slotRoom(S, CITY, ui.mode, ui.a, ui.b))); renderPlanner(); break;
    case 'borrow-for': act({ type: 'borrow', amt: +el.dataset.amt }); renderPlanner(); updateHud(); break;
    case 'open-route': doOpenRoute(); break;
    case 'route': openRouteSheet(+el.dataset.id); break;
    case 'rroute': openRivalRouteSheet(+el.dataset.id); break;
    case 'company': ui.pct = 1; openCompanySheet(el.dataset.id); break;
    case 'bid-show': ui.bidSeen = null; checkBid(); break;
    case 'route-fare': act({ type: 'fare', r: rkey(r), fare: +el.dataset.fare }); openRouteSheet(r.id); break;
    case 'auto-open': openAutoSheet(); break;
    case 'auto-toggle': {
      const A = me().pd.auto;
      act({ type: 'auto', set: { on: !A.on } });
      if (A.on) toast(`Autopilot on (${AUTO_RISK[A.risk].name.toLowerCase()}). It makes its first moves within a day or two.`); else toast('Autopilot off. You are in charge again.');
      updateAutoPill(); openAutoSheet(); break;
    }
    case 'auto-risk': act({ type: 'auto', set: { risk: el.dataset.k } }); openAutoSheet(); break;
    case 'auto-mode': {
      const m = el.dataset.m, modes = Object.assign({}, me().pd.auto.modes);
      modes[m] = !modes[m];
      if (MODE_IDS.some(x => modes[x])) act({ type: 'auto', set: { modes } });
      openAutoSheet(); break;
    }
    case 'auto-opt': act({ type: 'auto', set: { [el.dataset.k]: !me().pd.auto[el.dataset.k] } }); openAutoSheet(); break;
    case 'auto-region': {
      const regs = autoRegions(S, CITY, me()).slice(), r = el.dataset.r, i = regs.indexOf(r);
      if (i >= 0) { if (regs.length > 1) regs.splice(i, 1); else toast('Keep at least one region.'); } else regs.push(r);
      act({ type: 'auto', set: { regions: regs } });
      openAutoSheet(); break;
    }
    case 'routes-tab': ui.routesTab = el.dataset.tab; openRoutesSheet(); sheetBody.scrollTop = 0; break;
    case 'routes-mode': ui.routesMode = el.dataset.m; ui.routesAll = false; openRoutesSheet(); break;
    case 'routes-all': ui.routesAll = true; openRoutesSheet(); break;
    case 'goal-try': { const m = el.dataset.m, a = +el.dataset.a, b = +el.dataset.b; closeSheet(true); chooseMode(m, a); openPlanner(b); break; }
    case 'open-wars': ui.routesTab = 'war'; openRoutesSheet(); break;
    case 'war-fare': { const wr = S.routes.find(x => x.id === +el.dataset.id); if (wr) { act({ type: 'fare', r: rkey(wr), fare: +el.dataset.fare }); toast(`${CITY[wr.a].name} – ${CITY[wr.b].name}: ${FARES[wr.fare].name.toLowerCase()} fares.`); } openWarSheet(); break; }
    case 'war-add': { const wr = S.routes.find(x => x.id === +el.dataset.id); if (wr) { const res = act({ type: 'buy', r: rkey(wr), model: el.dataset.model, n: +el.dataset.n }); if (!res.ok) toast(res.msg); } openWarSheet(); break; }
    case 'buy': { const res = act({ type: 'buy', r: rkey(r), model: el.dataset.model, n: 1 }); if (!res.ok) toast(res.msg); openRouteSheet(r.id); break; }
    case 'sell': { act({ type: 'sell', r: rkey(r), model: el.dataset.model }); openRouteSheet(r.id); break; }
    case 'add-type': { const m = $('addModel').value; const res = act({ type: 'buy', r: rkey(r), model: m, n: 1 }); if (!res.ok) toast(res.msg); openRouteSheet(r.id); break; }
    case 'close-route': ui.confirm = 'close-' + r.id; openRouteSheet(r.id); break;
    case 'close-no': ui.confirm = null; openRouteSheet(r.id); break;
    case 'close-yes': { const res = act({ type: 'close', r: rkey(r) }); if (res.ok) toast(`Route closed. Vehicles sold for ${fmtMoney(res.value)}.`); closeSheet(); break; }
    case 'compete': {
      closeSheet(true);
      ui.mode = el.dataset.mode; ui.a = +el.dataset.a; ui.step = 'pickB';
      ui.opp = computeOpp(ui.mode, ui.a);
      openPlanner(+el.dataset.b, 0);
      break;
    }
    case 'accept-offer': {
      const res = act({ type: 'acceptOffer', id: +el.dataset.id });
      if (!res.ok) { toast(res.msg); refreshSheet(); break; }
      toast(`${CITY[res.route.a].name} – ${CITY[res.route.b].name} is yours.`);
      ui.sel = { type: 'route', id: res.route.id };
      openRouteSheet(res.route.id); updateBadges();
      break;
    }
    case 'pct': ui.pct = Math.max(1, ui.pct + +el.dataset.d); openCompanySheet(ui.sel.id); break;
    case 'payout': if (act({ type: 'payout', id: el.dataset.id, v: +el.dataset.v }).ok) toast(`${S.cos[el.dataset.id].short} will pay out ${Math.round(+el.dataset.v * 100)}% of profit.`); openCompanySheet(el.dataset.id); break;
    case 'merge': ui.confirm = 'merge-' + el.dataset.id; openCompanySheet(el.dataset.id); break;
    case 'merge-no': ui.confirm = null; openCompanySheet(ui.sel.id); break;
    case 'merge-yes': { ui.confirm = null; const res = act({ type: 'merge', id: el.dataset.id }); if (!res.ok) { toast(res.msg); openCompanySheet(el.dataset.id); } else openMarketSheet(); updateBadges(); break; }
    case 'buy-stake': { const res = act({ type: 'buyStake', holder: el.dataset.holder, id: el.dataset.id }); toast(res.ok ? `Bought ${fmtPct(res.pct)} for ${fmtMoney(res.price)}.` : res.msg); if (S.cos[el.dataset.id]) openCompanySheet(el.dataset.id); else openMarketSheet(); break; }
    case 'start-bid': { const res = act({ type: 'siege', id: el.dataset.id }); toast(res.ok ? `Bid launched for ${S.cos[el.dataset.id].short}.` : res.msg, res.ok ? 'danger' : ''); openCompanySheet(el.dataset.id); updateBadges(); break; }
    case 'lobby': { const res = act({ type: 'lobby', id: el.dataset.id }); toast(res.ok ? `Lobbying shareholders this month (${fmtMoney(res.cost)}).` : res.msg); openCompanySheet(el.dataset.id); break; }
    case 'cancel-bid': act({ type: 'cancelSiege', id: el.dataset.id }); openCompanySheet(el.dataset.id); updateBadges(); break;
    case 'accept-board': { const res = act({ type: 'acceptBoard', id: el.dataset.id }); if (!res.ok) toast(res.msg); if (S.cos[el.dataset.id]) openCompanySheet(el.dataset.id); else openMarketSheet(); updateBadges(); break; }
    case 'projects': openProjectsSheet(); sheetBody.scrollTop = 0; break;
    case 'build-project': { const res = act({ type: 'project', p: el.dataset.p }); toast(res.ok ? `Construction started on the ${PROJECT[el.dataset.p].name}.` : res.msg); openProjectsSheet(); break; }
    case 'show-project': {
      const p = PROJECT[el.dataset.p], w = p.wps[Math.floor(p.wps.length / 2)];
      ui.sel = { type: 'project', id: p.id };
      centerOn(w[1], w[0], Math.max(4, cam.z / zMin()));
      if (vw < 860) closeSheet(true);
      break;
    }
    case 'buy-shares': {
      const id = el.dataset.id;
      const res = act({ type: 'buyShares', id, pct: ui.pct / 100 });
      if (!res.ok) toast(res.msg);
      else if (!S.over && S.cos[id] && !S.cos[id].lost) toast(`Bought ${fmtPct(res.pct)} for ${fmtMoney(res.cost)}.`);
      updateBadges();
      if (S.cos[id] && !S.cos[id].lost) openCompanySheet(id); else openMarketSheet();
      break;
    }
    case 'sell-shares': {
      const res = act({ type: 'sellShares', id: el.dataset.id, pct: ui.pct / 100 });
      if (res.ok) toast(`Sold ${fmtPct(res.pct)} for ${fmtMoney(res.value)}.`);
      openCompanySheet(el.dataset.id); break;
    }
    case 'borrow': { const got = act({ type: 'borrow', amt: +el.dataset.amt }).got; if (got) toast(`Borrowed ${fmtMoney(got)}.`); openFinanceSheet(); break; }
    case 'repay': { const got = act({ type: 'repay', amt: +el.dataset.amt }).got; if (got) toast(`Repaid ${fmtMoney(got)}.`); openFinanceSheet(); break; }
    case 'newgame': closeSheet(); showWelcome(); break;
    case 'mp-copy': copyInvite(); break;
    case 'hub-build': { const res = act({ type: 'hub', city: +el.dataset.city }); toast(res.ok ? `Hub open in ${CITY[+el.dataset.city].name}. Your routes there now connect.` : res.msg, res.ok ? 'goal' : ''); openCitySheet(+el.dataset.city); updateBadges(); break; }
    case 'hub-close': ui.confirm = 'hub-' + el.dataset.city; openCitySheet(+el.dataset.city); break;
    case 'hub-close-no': ui.confirm = null; openCitySheet(ui.sel.id); break;
    case 'hub-close-yes': { ui.confirm = null; const res = act({ type: 'unhub', city: +el.dataset.city }); if (res.ok) toast(`Hub closed. ${fmtMoney(res.value)} back.`); openCitySheet(+el.dataset.city); break; }
    case 'mp-leave': ui.confirm = 'mp-leave'; openPlayersSheet(); break;
    case 'mp-leave-no': ui.confirm = null; openPlayersSheet(); break;
    case 'mp-leave-yes': ui.confirm = null; mpLeave(); break;
  }
  if (S && !S.over) updateHud();
});

// A new world with the first company in it, started in a region with a fair starter route.
function freshWorld(regionId, name, nAI, diff) {
  const W = newState((Date.now() ^ (Math.random() * 1e9)) >>> 0, CITY, CITY_ROWS);
  W.diff = DIFFS[diff] ? diff : 'normal';
  computeRates(W, CITY);
  const P = W.cos.p;
  if (name) { P.name = name; P.short = name; }
  const st = regionId === 'free' ? null : pickStarter(W, CITY, regionId);
  if (st) {
    P.cash = 1e12;
    openRoute(W, CITY, 'p', 'road', st.a, st.b, st.model, st.n, 1);
    P.cash = START_TOTAL - st.cost; P.ledger.cur.capex = 0;
    W.news = [];
    W.home = st.a; P.home = st.a;
    const A = CITY[st.a].name, B = CITY[st.b].name;
    logTo(W, 'p', `${P.name} opens for business in ${A} with ${st.n} ${plural(MODEL[st.model].name, st.n).toLowerCase()} running to ${B}.`, 'build');
  } else {
    P.cash = START_TOTAL;
    logTo(W, 'p', `${P.name} opens for business with ${fmtMoney(P.cash)} in the bank.`, 'build');
  }
  setupWorld(W, CITY, st ? regionId : null, nAI);
  return { W, st };
}
// point the camera at a new company's starting route, or its region
function aimAt(regionId, st) {
  const K = me();
  if (st) {
    const R = REGIONS.find(r => r.id === regionId) || { zoom: 4 };
    const mid = mercXY((CITY[st.a].lon + CITY[st.b].lon) / 2, (CITY[st.a].lat + CITY[st.b].lat) / 2);
    cam.x = mid[0]; cam.y = mid[1]; cam.z = R.zoom * zMin(); clampCam();
    const g = geoFor(st.a, st.b);
    fitView(g.minX, g.maxX, g.minY, g.maxY, { pad: 0.9, maxF: 16, ms: 1100 });
  } else if (K && K.home != null) centerOn(CITY[K.home].lon, CITY[K.home].lat, 4);
  else if (regionId) { const R = REGIONS.find(r => r.id === regionId); if (R && R.lon != null) centerOn(R.lon, R.lat, R.zoom); else centerOn(20, 25, 1); }
}
function newGame(regionId, name) {

// A rival's offer for your company waits on screen until you answer (a solo game pauses meanwhile).
function checkBid() {
  const P = me(), b = P && P.bid;
  // an offer that lapsed (or was answered on another phone) takes its card with it
  const open = !$('overlay').hidden && $('overlay').querySelector('[data-bidcard]');
  if (open && (!b || b.stage !== 'offer' || String(b.at) !== open.dataset.bidcard)) { $('overlay').hidden = true; return; }

  ui.bidSeen = b.at;
  const K = S.cos[b.by];

// ---------- persistence ----------
// Solo games save in this browser; shared games live in the artifact's database instead.
function serialize() {
  const o = {};
  for (const k in S) if (k[0] !== '_') o[k] = S[k];
  o.cam = { x: cam.x, y: cam.y, zf: cam.z / zMin() };
  return JSON.stringify(o);
}
function save() { if (!S || NET.on) return; try { localStorage.setItem(SAVE_KEY, serialize()); } catch (e) { /* storage unavailable */ } }
function restore(str) {
  try {
    let o = JSON.parse(str);
    if (!o || !Array.isArray(o.routes)) return false;
    if (o.v === 1) o = migrate(o, CITY, CITY_ROWS);
    else if (o.v !== 2) return false;
    S = hydrate(o, CITY);
    MY = 'p';
    if (o.cam) { cam.x = o.cam.x; cam.y = o.cam.y; cam.z = o.cam.zf * zMin(); clampCam(); }
    ui.seenGoals = Object.keys(me().pd.goals).length;
    return true;
  } catch (e) { return false; }
}

// ---------- hooks + loop ----------
// The simulation reports what happened; each page shows only what concerns its own company.
const hooks = {
  deliver(r, v, to, rev) {
    if (r.co !== MY || cam.z / zMin() < 1.8) return;
    const c = CITY[to], now = performance.now();
    const near = f => Math.abs(f.x - c.x) * cam.z < 60 && Math.abs(f.y - c.y) * cam.z < 30;
    const f = floaters.find(f => now - f.t0 < 1100 && near(f));
    if (f) { f.amt += rev; f.text = fmtMoney(f.amt, true); return; }
    if (floaters.some(f => now - f.t0 < 1500 && near(f))) return;
    floaters.push({ city: to, x: c.x, y: c.y, amt: rev, text: fmtMoney(rev, true), t0: now });
    if (floaters.length > 14) floaters.shift();
  },
  month() { refreshSheet(); updateBadges(); updateAutoPill(); save(); },
  news(text, kind, who, except) {
    if ((who && who !== MY) || (except && except === MY)) return;
    toast(text, kind === 'goal' ? 'goal' : kind === 'war' || /your company|your .* route/.test(text) ? 'danger' : '');
  },
  dividend(text, who) { if (who === MY) toast(text, 'goal'); },
  auto(text, who) {
    if (who !== MY) return;
    // gather a burst of autopilot moves into one message
    autoBurst.items.push(text);
    if (!autoBurst.timer) autoBurst.timer = setTimeout(flushAuto, 3000);
    if (ui.sheet === 'auto') refreshSheet();
  },
  victory(who) { const P = me(); if (who !== MY || !P || ui.wonShown) return; ui.wonShown = true; P.pd.won = true; save(); setTimeout(showVictory, 400); },
  goal(g, txt, who) { if (who !== MY) return; toast(txt, 'goal'); updateBadges(); },
  takeover(acq, tgt, text, alt) {
    const mine = acq === MY || tgt === MY;
    const sold = tgt === MY && me() && me().out && me().out.type === 'sold';
    toast(mine ? text : (alt || text), acq === MY || sold ? 'goal' : tgt === MY ? 'danger' : '');
    updateBadges();
  },
};

const autoBurst = { items: [], timer: 0 };
function flushAuto() {
  autoBurst.timer = 0;
  const it = autoBurst.items; autoBurst.items = [];
  if (!it.length) return;
  toast(it.length === 1 ? 'Autopilot ' + it[0] : `Autopilot made ${it.length} moves. Latest: ${it[it.length - 1]}`);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  cover.to = sheetCover();
  stepCover();
  stepCam(now);
  if (NET.on) netFrame(dt, now);
  else if (S && !S.over && speed > 0 && $('overlay').hidden) {
    advance(S, CITY, dt / DAY_SEC * speed, hooks);
    if (S.over) { save(); showGameOver(); }
  }
  if (!NET.on && S && S.over && $('overlay').hidden) { save(); showGameOver(); }
  // a drawing error must never stop the game loop
  try { draw(now); } catch (e) { if (!frame.warned) { frame.warned = true; console.error(e); } }
  if (S && me() && !S.over) { updateHud(); checkBid(); }
  requestAnimationFrame(frame);
}

function start(data) {
  readColors();
  layout();
  netWire();
  centerOn(20, 25, 1);
  netInit();
  let ok = false;
  if (data && data.save) { ok = restore(data.save); if (ok && data.speed != null) setSpeed(data.speed); }
  if (!ok) { let saved = null; try { saved = localStorage.getItem(SAVE_KEY); } catch (e) {} if (saved) ok = restore(saved); }
  if (ok) { $('overlay').hidden = true; hudKey = ''; updateAutoPill(); if (!S.over) { updateHud(); updateBadges(); } else showGameOver(); }
  else showWelcome();
  requestAnimationFrame(t => { last = t; frame(t); });
}

window.addEventListener('resize', () => { const zf = cam.z / (zMin() || 1); layout(); cam.z = zf * zMin(); clampCam(); });
new ResizeObserver(() => layout()).observe(hud);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });

const HOT = window.claude && window.claude.hot;
if (HOT && HOT.snapshot) HOT.snapshot(() => ({ save: S && !NET.on ? serialize() : null, speed }));
if (HOT && HOT.ready) HOT.ready(start); else start((HOT && HOT.data) || {});

})();
</script>
